<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>휴먼티처닷컴 | 휴먼쌤</title>
<meta name="description" content="AI와 함께 살아갈 아이가 자기 생각을 만들고 판단하도록 돕는 교육 콘텐츠. 휴먼쌤의 책과 자료(클라우드), 앱과 도구(앱), 이야기와 월드(월드)로 가는 입구입니다.">
<meta name="color-scheme" content="light">
<link rel="icon" href="assets/humanssam.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 화면은 주소 뒤 #으로 고른다: #/ 처음 · #/cloud · #/app · #/world · #/<칸>/<slug> 소개 페이지.
   내용은 data.js. 휴대폰 390px 기준, 720px·1040px에서 넓어진다. */
:root{
  --paper:#FFFDF8; --ink:#3A2A1F; --brown:#5A4232; --soft:#8A7464; --tint:#F3E9DD; --line:#E8DCCD;
  --cloud:#DCEBF7; --cloudd:#2F5D8A; --app:#ECE3F7; --appd:#6A3FA0; --world:#DDEFE0; --worldd:#2E6B45;
  --okbg:#DDEFE7; --ok:#1F5E43; --focus:#C9772E;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{font-family:"Gowun Dodum","Noto Sans KR",system-ui,sans-serif;line-height:1.55;-webkit-text-size-adjust:100%}
img{display:block;max-width:100%;height:auto}
a{color:inherit}
a:focus-visible,button:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.jua{font-family:"Jua",sans-serif;font-weight:400}
.wrap{max-width:1080px;margin:0 auto;padding:0 18px}

/* 머리 */
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 0 8px}
.word{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--brown);font-family:"Jua",sans-serif;font-size:24px;line-height:1}
.word img{width:30px;height:30px;object-fit:cover;object-position:top;border-radius:50%;background:var(--tint)}
.nav{display:flex;gap:6px}
.nav a{font-family:"Jua",sans-serif;font-size:15px;text-decoration:none;color:var(--brown);padding:6px 10px;border-radius:999px}
.nav a[aria-current="page"]{background:var(--brown);color:#fff}

main{padding:6px 0 40px}
.view{display:grid;gap:18px}

/* 처음 */
.hi{display:grid;grid-template-columns:84px 1fr;gap:12px;align-items:center;padding:6px 0 4px}
.hi img{width:84px}
.bubble{background:var(--tint);border-radius:20px 20px 20px 4px;padding:12px 16px;font-size:15px}
.bubble b{font-family:"Jua",sans-serif;font-weight:400;font-size:19px;color:var(--brown)}
.h2{margin:4px 0 0;font-family:"Jua",sans-serif;font-weight:400;font-size:22px;color:var(--brown)}
.doors{display:grid;gap:16px}
.door{display:grid;text-decoration:none;color:var(--ink);background:#fff;border:3px solid var(--brown);border-radius:24px;overflow:hidden;box-shadow:0 6px 0 var(--brown);transition:transform .12s,box-shadow .12s}
.door:hover{transform:translateY(-2px);box-shadow:0 8px 0 var(--brown)}
.door:active{transform:translateY(3px);box-shadow:0 3px 0 var(--brown)}
.door img{aspect-ratio:16/10;width:100%;object-fit:cover;border-bottom:3px solid var(--brown)}
.door .tx{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px 14px}
.door p{margin:0;font-size:15px;line-height:1.45;color:var(--brown);word-break:keep-all}
.meet{display:grid;gap:12px}
.go{flex:none;font-family:"Jua",sans-serif;font-size:15px;background:var(--brown);color:#fff;border-radius:999px;padding:6px 14px}

/* 채널 */
.chs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;background:#fff;border:2px solid var(--brown);border-radius:20px;padding:14px 8px 12px}
.ch{display:grid;justify-items:center;gap:4px;text-decoration:none;color:var(--ink);padding:2px 0;border-radius:14px}
.ch img{width:52px;height:52px;border-radius:15px;transition:transform .12s}
.ch:hover img{transform:translateY(-3px)}
.ch b{font-family:"Jua",sans-serif;font-weight:400;font-size:15px;line-height:1.2;color:var(--brown)}
.ch small{font-size:11px;color:var(--soft);line-height:1.2;text-align:center;word-break:keep-all}

/* 칸 머리 */
.back{justify-self:start;font-family:"Jua",sans-serif;font-size:16px;color:var(--brown);text-decoration:none;padding:4px 0}
.head{border:3px solid var(--brown);border-radius:22px;padding:16px 18px}
.head h1{margin:0;font-family:"Jua",sans-serif;font-weight:400;font-size:32px;line-height:1.1;color:var(--brown)}
.head .sub{font-family:"Jua",sans-serif;font-size:17px}
.head p{margin:6px 0 0;font-size:14px;color:var(--soft)}
.cloud{background:var(--cloud)} .cloud .sub{color:var(--cloudd)}
.app{background:var(--app)} .app .sub{color:var(--appd)}
.world{background:var(--world)} .world .sub{color:var(--worldd)}
.hint{margin:0;font-size:13px;color:var(--soft)}
.story{background:#fff;border:2px dashed var(--line);border-radius:16px;padding:12px 16px;font-size:14px}
.story b{font-size:16px}

/* 카드 */
.grid{display:grid;gap:14px;margin:0;padding:0;list-style:none}
.card{display:grid;height:100%;text-decoration:none;color:var(--ink);background:#fff;border:2px solid var(--line);border-radius:18px;overflow:hidden;transition:transform .12s,border-color .12s}
.card:hover{transform:translateY(-2px);border-color:var(--brown)}
.card img{aspect-ratio:16/10;width:100%;object-fit:cover;background:var(--tint);border-bottom:2px solid var(--line)}
.card .tx{display:grid;gap:5px;align-content:start;padding:11px 14px 14px}
.card b{font-size:17px;font-weight:700;line-height:1.35}
.card p{margin:0;font-size:13px;color:var(--soft);word-break:keep-all}
.st{justify-self:start;font-size:11px;border-radius:999px;padding:1px 9px;background:var(--tint);color:var(--soft)}
.st.ok{background:var(--okbg);color:var(--ok)}
.st.grp{background:#fff;border:1.5px solid var(--brown);color:var(--brown)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.block .kids{margin-top:4px}
.more{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px;color:var(--soft);border-top:2px dashed var(--line);padding-top:14px}
.more a{font-family:"Jua",sans-serif;font-size:16px;color:var(--brown);text-decoration:none;border:2px solid var(--brown);border-radius:999px;padding:4px 14px}


.foot{padding:10px 0 34px;font-size:12px;color:var(--soft);text-align:center}

@media (min-width:720px){
  .wrap{padding:0 32px}
  .grid{grid-template-columns:1fr 1fr}
  .doors{grid-template-columns:1fr 1fr 1fr}
  .door p{font-size:16px}
  .meet{max-width:720px;width:100%;justify-self:center;text-align:center;margin-top:10px}
  .hi{grid-template-columns:104px auto;justify-content:start}
  .hi img{width:104px}
  .bubble{font-size:17px}
  .bubble b{font-size:22px}
  .chs{padding:20px 20px 18px;gap:10px}
  .ch img{width:64px;height:64px;border-radius:18px}
  .ch b{font-size:17px}
  .ch small{font-size:12px}
}
@media (min-width:1040px){
  .grid{grid-template-columns:1fr 1fr 1fr}
  .head h1{font-size:40px}
}

/* ===== 소개 페이지 (개편 2) ===== */
.dv{gap:22px}
.hero{display:grid;gap:18px;border:3px solid var(--brown);border-radius:28px;padding:16px 16px 20px;box-shadow:0 7px 0 var(--brown)}
.view>*,.hero>*,.labs>*,.block>*{min-width:0}
.frame{background:#fff;border:2px solid var(--brown);border-radius:16px;overflow:hidden;box-shadow:0 10px 24px rgba(58,42,31,.14)}
.frame .fb{display:flex;align-items:center;gap:6px;padding:7px 10px;background:#FBF6EF;border-bottom:2px solid var(--brown)}
.frame .fb i{width:9px;height:9px;border-radius:50%;background:#E5D6C4;flex:none}
.frame .fb i:nth-child(1){background:#F08C7A}.frame .fb i:nth-child(2){background:#F2C46B}.frame .fb i:nth-child(3){background:#8FCB8A}
.frame .fb span{flex:1;min-width:0;margin-left:6px;font-size:11px;color:var(--soft);background:#fff;border:1px solid var(--line);border-radius:999px;padding:1px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.frame img{width:100%;aspect-ratio:16/10;object-fit:cover}
.htx{display:grid;gap:10px;align-content:center}
.kind{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-family:"Jua",sans-serif;font-size:15px;color:var(--brown)}
.htx h1{margin:0;font-family:"Jua",sans-serif;font-weight:400;font-size:34px;line-height:1.15;color:var(--ink);word-break:keep-all}
.htx .one{margin:0;font-size:16px;color:var(--brown);word-break:keep-all}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 0;padding:0;list-style:none}
.tags li{font-size:13px;background:rgba(255,255,255,.75);border:1.5px solid var(--brown);border-radius:999px;padding:3px 11px;color:var(--brown)}
.cloud .tags li{border-color:var(--cloudd);color:var(--cloudd)}
.app .tags li{border-color:var(--appd);color:var(--appd)}
.world .tags li{border-color:var(--worldd);color:var(--worldd)}
.enter{display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;font-family:"Jua",sans-serif;font-size:20px;color:#fff;background:var(--brown);border-radius:16px;padding:14px 18px;box-shadow:0 5px 0 #2A1D14;transition:transform .12s,box-shadow .12s}
.enter:hover{transform:translateY(-2px);box-shadow:0 7px 0 #2A1D14}
.enter:active{transform:translateY(3px);box-shadow:0 2px 0 #2A1D14}
button.enter{width:100%;border:0;font-weight:400;cursor:pointer}
.sheet{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:4px 8px;text-decoration:none;font-family:"Jua",sans-serif;font-size:18px;color:var(--brown);background:#fff;border:2.5px solid var(--brown);border-radius:16px;padding:11px 16px;transition:transform .12s}
.sheet:hover{transform:translateY(-2px)}
.sheet svg{width:20px;height:20px}
.sheet small{font-family:"Gowun Dodum","Noto Sans KR",sans-serif;font-size:13px;color:var(--soft)}
.enters{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.enter.sm{font-size:16px;padding:11px 10px}
.wait{border-radius:16px;padding:14px 18px;background:rgba(255,255,255,.7);border:2px dashed var(--soft);color:var(--soft);font-family:"Jua",sans-serif;font-size:18px;text-align:center}
.info{display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:start;font-size:13px;color:var(--brown);background:rgba(255,255,255,.65);border-radius:12px;padding:9px 12px}
.info svg{width:20px;height:20px;margin-top:1px}
.fnote{margin:-8px 4px 0;font-size:12px;color:var(--soft);text-align:right}
.block{display:grid;gap:10px;background:#fff;border:2px solid var(--line);border-radius:22px;padding:18px 18px 16px}
.block h2{display:flex;align-items:center;gap:10px;margin:0;font-family:"Jua",sans-serif;font-weight:400;font-size:21px;color:var(--brown)}
.block h2::before{content:"";width:6px;height:22px;border-radius:3px;background:var(--brown)}
.block p{margin:0;font-size:16px;line-height:1.75;word-break:keep-all}
.block a.ln{display:inline-flex;gap:6px;align-items:center;color:var(--brown);font-weight:700;text-decoration:none;border-bottom:2px solid var(--line)}
.labs{display:grid;gap:14px;margin:0;padding:0;list-style:none}
.lab{display:grid;gap:8px;text-decoration:none;color:var(--ink)}
.lab .frame img{aspect-ratio:16/10}
.lab b{font-size:16px;color:var(--brown)}
.lab p{margin:0;font-size:14px;line-height:1.6;color:var(--soft)}
/* 영상 목록(세로 영상: 휴대폰에서는 한 줄에 하나, 넓은 화면에서는 두세 개) */
.warn{display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:start;font-size:14px;line-height:1.6;color:var(--brown);background:#FFF4D6;border:2px solid #E0A33A;border-radius:14px;padding:10px 14px}
.warn svg{width:20px;height:20px;margin-top:2px}
.warn p{margin:0;font-size:14px;line-height:1.6}
.vids{display:grid;gap:26px;margin:4px 0 0;padding:0;list-style:none}
.vid{display:grid;gap:4px;justify-items:center;text-align:center}
.vid .vh{display:flex;align-items:center;gap:8px;font-family:"Jua",sans-serif;font-size:19px;color:var(--brown)}
.vid .no{font-size:13px;background:var(--brown);color:#fff;border-radius:999px;padding:1px 9px}
.vid .ex{margin:0;font-family:"Jua",sans-serif;font-size:22px;line-height:1.3;color:var(--ink);word-break:keep-all}
.vid .tp{margin:0 0 6px;font-size:13px;line-height:1.4;color:var(--soft)}
.vid video{display:block;width:100%;max-width:360px;aspect-ratio:9/16;background:#1d1a17;border:2px solid var(--brown);border-radius:16px}
.rel h2{margin:0 0 10px;font-family:"Jua",sans-serif;font-weight:400;font-size:20px;color:var(--brown)}
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(200px,62%);gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 10px;margin:0;list-style:none}
.rail li{scroll-snap-align:start}
.rail .card b{font-size:15px}
@media (min-width:720px){
  .hero{grid-template-columns:1.15fr 1fr;gap:28px;padding:24px 26px 26px;align-items:center}
  .htx h1{font-size:40px}
  .labs{grid-template-columns:1fr 1fr}
  .vids{grid-template-columns:1fr 1fr}
  .rail{grid-auto-columns:240px}
  .block{padding:24px 28px 22px}
}
@media (min-width:1040px){ .vids{grid-template-columns:1fr 1fr 1fr} }
@media (max-width:380px){
  .nav a{padding:6px 7px;font-size:14px}
  .ch img{width:46px;height:46px}
}
@media (prefers-reduced-motion:reduce){.door,.card,.ch img,.enter,.sheet{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="bar">
    <a class="word" href="#/"><img src="assets/humanssam.png" alt="">휴먼쌤</a>
    <nav class="nav" aria-label="칸 고르기">
      <a href="#/cloud" data-k="cloud">클라우드</a>
      <a href="#/app" data-k="app">앱</a>
      <a href="#/world" data-k="world">월드</a>
    </nav>
  </header>
  <main id="main" tabindex="-1"></main>
  <footer class="foot">human-teacher.com</footer>
</div>

<!-- data.js를 고치면 아래 v= 숫자를 올린다(브라우저·CDN이 옛 내용을 기억하지 않게) -->
<script src="data.js?v=20261024f"></script>
<script>
(function(){
  var S = window.SITE, main = document.getElementById('main'), ORDER = ['cloud','app','world'];

  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function chip(st){ return '<span class="st' + (st === '열림' ? ' ok' : '') + '">' + esc(st) + '</span>'; }
  function ext(url){ return ' href="' + esc(url) + '" rel="noopener"'; }

  function home(){
    var h = '<div class="view">'
      + '<div class="hi"><img src="assets/humanssam.png" alt="휴먼쌤 캐릭터" width="371" height="437"><div class="bubble"><b>안녕하세요, 휴먼쌤이에요.</b><br>생각주도력을 키우는 교사아빠예요. 어디로 갈까요?</div></div>'
      + '<div class="doors">';
    ORDER.forEach(function(k){
      var s = S.sections[k];
      // 썸네일 안에 칸 이름이 이미 크게 있어서 아래에는 이름을 다시 쓰지 않는다(휴먼쌤 10-24)
      h += '<a class="door" href="#/' + k + '" aria-label="' + esc(s.title) + ' 들어가기"><img src="' + esc(s.thumb) + '" alt="" loading="lazy" width="800" height="500">'
        + '<span class="tx"><p>' + esc(s.card) + '</p><span class="go" aria-hidden="true">들어가기</span></span></a>';
    });
    h += '</div><section class="meet"><h2 class="h2">휴먼쌤 만나러 가기</h2><nav class="chs" aria-label="휴먼쌤 채널">';
    S.channels.forEach(function(c){
      h += '<a class="ch"' + ext(c.url) + '><img src="' + esc(c.icon) + '" alt="" width="96" height="96"><b>' + esc(c.name) + '</b><small>' + esc(c.desc) + '</small></a>';
    });
    return h + '</nav></section></div>';
  }

  function others(k){
    var h = '<div class="more">다른 곳도 둘러보기';
    ORDER.forEach(function(o){ if (o !== k) h += '<a href="#/' + o + '">' + esc(S.sections[o].title) + '</a>'; });
    return h + '<a href="#/">처음으로</a></div>';
  }

  function section(k){
    var s = S.sections[k];
    var h = '<div class="view"><a class="back" href="#/">‹ 처음으로</a>'
      + '<div class="head ' + s.color + '"><h1>' + esc(s.title) + '</h1><div class="sub">' + esc(s.sub) + '</div><p>' + esc(s.lead) + '</p></div>';
    if (s.story) h += '<h2 class="h2">이야기</h2><div class="story">' + chip(s.story.status) + ' <b>' + esc(s.story.name) + '</b><br>' + esc(s.story.one) + '</div><h2 class="h2">3D 월드와 체험</h2>';
    h += '<p class="hint">' + esc(s.hint) + '</p><ul class="grid">';
    s.items.forEach(function(it){ if (!it.parent) h += card(k, it); });
    return h + '</ul>' + others(k) + '</div>';
  }

  // 카드 한 장. 묶음(children)이 있으면 '모음 · N곳' 표시를 더한다. 묶음에 속한 것(parent)은 목록에서 숨기고 묶음 페이지에서 보여 준다.
  function card(k, it){
    return '<li><a class="card" href="#/' + k + '/' + esc(it.slug) + '">'
      + (it.thumb ? '<img src="' + esc(it.thumb) + '" alt="" loading="lazy" width="800" height="500">' : '<img alt="">')
      + '<span class="tx"><b>' + esc(it.name) + '</b><span class="chips">' + chip(it.status)
      + (it.children ? '<span class="st grp">모음 · ' + it.children.length + '곳</span>' : '') + '</span>'
      + '<p>' + esc(it.one) + '</p></span></a></li>';
  }
  function byslug(s, slug){ return s.items.filter(function(x){ return x.slug === slug; })[0]; }

  // 브라우저 창 모양 액자. 주소 칸에는 그 앱·월드의 도메인을 보여 준다.
  function frame(img, url, alt){
    var host = '';
    try { host = url ? new URL(url).host.replace(/^www\./, '') : ''; } catch (e) {}
    return '<div class="frame"><div class="fb"><i></i><i></i><i></i><span>' + esc(host || 'human-teacher.com') + '</span></div>'
      + '<img src="' + esc(img) + '" alt="' + esc(alt || '') + '" width="800" height="500"></div>';
  }
  var INFO = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 11v6M12 7.5v.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>';
  var SHEET = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h8l4 4v14H6z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M12 10v7M9 14l3 3 3-3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  function detail(k, it){
    var s = S.sections[k], tags = (S.tags || {})[it.slug] || [];
    var firstUrl = it.url || (it.enterLinks && it.enterLinks[0].url) || '';
    var par = it.parent ? byslug(s, it.parent) : null;
    var h = '<div class="view dv">'
      + (par ? '<a class="back" href="#/' + k + '/' + esc(par.slug) + '">‹ ' + esc(par.name) + '</a>' : '<a class="back" href="#/' + k + '">‹ ' + esc(s.title) + ' 목록</a>')
      + '<article class="hero ' + s.color + '">'
      + (it.thumb ? frame(it.thumb, firstUrl, it.name) : '')
      + '<div class="htx"><div class="kind">' + chip(it.status) + esc(s.title) + ' · ' + esc(par ? par.name : s.sub) + '</div>'
      + '<h1>' + esc(it.name) + '</h1><p class="one">' + esc(it.one) + '</p>';
    if (tags.length) h += '<ul class="tags">' + tags.map(function(t){ return '<li>' + esc(t) + '</li>'; }).join('') + '</ul>';
    if (it.url) h += '<a class="enter"' + ext(it.url) + '>바로 들어가기 <span aria-hidden="true">›</span></a>';
    else if (it.enterLinks) {
      h += '<div class="enters">';
      it.enterLinks.forEach(function(l){ h += '<a class="enter sm"' + ext(l.url) + '>' + esc(l.label) + ' <span aria-hidden="true">›</span></a>'; });
      h += '</div>';
    }
    // 바로 갈 주소가 없고 묶음이면 아래 목록으로 내려 주는 버튼
    else if (it.children) h += '<button class="enter" type="button" data-jump="kids">들어갈 곳 고르기 <span aria-hidden="true">›</span></button>';
    // 바로 갈 주소가 없고 영상이 이 페이지에 있으면, 버튼은 아래 영상 목록으로 내려 준다
    else if (it.videos) h += '<button class="enter" type="button" data-jump="vids">영상 ' + it.videos.length + '편 보기 <span aria-hidden="true">›</span></button>';
    else h += '<div class="wait">' + esc(it.status) + '</div>';
    if (it.worksheet) h += '<a class="sheet" href="' + esc(it.worksheet) + '" download="' + esc(it.name.split(' — ')[0]) + ' 활동지.pdf">' + SHEET + '학생 활동지 내려받기 <small>' + esc(it.sheetNote || 'A4 1쪽 · PDF') + '</small></a>';
    if (it.note) h += '<div class="info">' + INFO + '<span>' + esc(it.note) + '</span></div>';
    h += '</div></article>';
    if (it.shotNote) h += '<p class="fnote">' + esc(it.shotNote) + '</p>';

    h += '<section class="block"><h2>소개</h2>';
    (it.intro || []).forEach(function(p){ h += '<p>' + esc(p) + '</p>'; });
    (it.links || []).forEach(function(l){ h += '<p><a class="ln"' + ext(l.url) + '>' + esc(l.label) + ' <span aria-hidden="true">›</span></a></p>'; });
    h += '</section>';

    if (it.children) {
      h += '<section class="block" id="kids"><h2>' + esc(it.name) + '</h2><ul class="grid kids">';
      it.children.forEach(function(c){ var ch = byslug(s, c); if (ch) h += card(k, ch); });
      h += '</ul></section>';
    }

    if (it.videos) {
      h += '<section class="block" id="vids"><h2>영상 ' + it.videos.length + '편</h2>';
      (it.warn || []).forEach(function(p){ h += '<div class="warn">' + INFO + '<p>' + esc(p) + '</p></div>'; });
      h += '<ul class="vids">';
      it.videos.forEach(function(v){
        h += '<li class="vid"><div class="vh"><span class="no">' + esc(v.no) + '</span>' + esc(v.title) + '</div>'
          + '<p class="ex">' + esc(v.ex) + '</p><p class="tp">' + esc(v.tip) + '</p>'
          + '<video controls playsinline preload="none" poster="' + esc(v.poster) + '" src="' + esc(v.file) + '" aria-label="' + esc(v.no + ' ' + v.title + ' 영상') + '"></video></li>';
      });
      h += '</ul></section>';
    }

    if (it.shots) {
      h += '<section class="block"><h2>실험실 다섯</h2><ul class="labs">';
      it.shots.forEach(function(x){
        h += '<li><a class="lab"' + ext(x.url) + '>' + frame(x.image, x.url, x.title + ' 화면') + '<b>' + esc(x.title) + ' ›</b><p>' + esc(x.desc) + '</p></a></li>';
      });
      h += '</ul></section>';
    } else if (it.shot && it.shot !== it.thumb) {
      h += '<section class="block"><h2>화면</h2>' + frame(it.shot, firstUrl, it.shotAlt || it.name + ' 화면') + '</section>';
    }

    // 묶음 안의 것이면 같은 묶음의 다른 곳을, 아니면 칸의 다른 것(묶음 안의 것은 빼고)을 넘겨 본다
    var rest = par
      ? par.children.filter(function(c){ return c !== it.slug; }).map(function(c){ return byslug(s, c); }).filter(Boolean)
      : s.items.filter(function(x){ return x.slug !== it.slug && !x.parent; });
    if (rest.length) {
      h += '<section class="rel"><h2>' + esc(par ? par.name + '의 다른 곳' : s.title + '의 다른 것') + '</h2><ul class="rail">';
      rest.forEach(function(x){
        h += '<li><a class="card" href="#/' + k + '/' + esc(x.slug) + '"><img src="' + esc(x.thumb) + '" alt="" loading="lazy" width="800" height="500"><span class="tx"><b>' + esc(x.name) + '</b>' + chip(x.status) + '</span></a></li>';
      });
      h += '</ul></section>';
    }
    return h + others(k) + '</div>';
  }

  function route(){
    var hash = location.hash.replace(/^#\/?/, ''), parts = hash.split('/'), k = parts[0], html, title = '휴먼티처닷컴 | 휴먼쌤';
    if (S.sections[k] && parts[1]) {
      var it = S.sections[k].items.filter(function(x){ return x.slug === parts[1]; })[0];
      if (it) { html = detail(k, it); title = it.name + ' | 휴먼티처닷컴'; } else { html = section(k); }
    } else if (S.sections[k]) { html = section(k); title = S.sections[k].title + ' | 휴먼티처닷컴'; }
    else { html = home(); k = ''; }
    main.innerHTML = html;
    document.title = title;
    [].forEach.call(document.querySelectorAll('.nav a'), function(a){ if (a.getAttribute('data-k') === k) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current'); });
    window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', route);
  // '영상 보기' 버튼: 주소(#)를 바꾸지 않고 아래 목록으로 내려간다
  main.addEventListener('click', function(e){
    var b = e.target.closest && e.target.closest('[data-jump]'), t = b && document.getElementById(b.getAttribute('data-jump'));
    if (t) t.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
  // 영상 하나를 틀면 다른 영상은 멈춘다
  main.addEventListener('play', function(e){
    [].forEach.call(main.querySelectorAll('video'), function(v){ if (v !== e.target) v.pause(); });
  }, true);
  route();
})();
</script>
</body>
</html>
