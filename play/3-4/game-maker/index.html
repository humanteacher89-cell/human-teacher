<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f2a44">
<meta name="color-scheme" content="light dark">
<title>게임 메이커 — 3-4학년</title>
<link rel="icon" href="data:,">

/* 오류 모으기(점검 도구 · 기기 진단이 읽는다)와, 우리 주소의 글꼴 목록을 못 받았을 때 Google Fonts로 넘어가기.
   옛 브라우저에서도 돌도록 옛 문법으로만 쓴다. */
window.__errs = [];
window.addEventListener('error', function (e) { if (e && e.message) window.__errs.push(String(e.message) + (e.lineno ? ' (' + e.lineno + '줄)' : '')); });
window.addEventListener('unhandledrejection', function (e) { var r = e && e.reason; window.__errs.push('promise: ' + String((r && r.message) || r)); });

<style>
/* 게임 메이커 새 판 — 5-6학년 시안 6판 (2026-11-12 휴먼쌤 "이 꼴로 옮기기": 화면 꼴 시안 2판대로)
   폰 · 태블릿: 가로로만. 왼쪽 차례 띠 · 가운데(질문은 위, 답은 화면 가득) · 오른쪽 큰 단추 하나. 기준 무대 760×320.
   PC(html.pc): 왼쪽 차례 칸 · 가운데 무대(질문 위, 이전 · 다음 아래). 기준 무대 1280×720.
   무대(.app)는 화면에 맞춰 통째로 커지고 작아진다(app.js의 layout). 아래로 밀어 내리는 화면은 없다. */
:root{
  color-scheme:light dark;   /* 11-13: 'only light'는 삼성 인터넷이 따르지 않았다. 다크를 스스로 다룬다고 알리고, 다크에서도 밝은 색을 그대로 쓴다(맨 아래 다크 규칙) */
  --ink:#1d2433;--soft:#4a5568;--mute:#6b7486;--line:#cbd8ee;--line2:#dde6f4;--navy:#1f2a44;--sky2:#eaf3ff;
  --cta:#ffcc33;--cta-d:#dba400;--cta-soft:#fff3c4;--blue:#2f62c9;--royal:#3f5efb;--teal:#0e9e90;--teal-soft:#dff3ef;--pop:#d9481f;--pop-soft:#ffe8dd;--night:#1f2a44;
  --disp:'Jua','Gowun Dodum','Apple SD Gothic Neo','Noto Sans KR','Noto Sans CJK KR','Malgun Gothic',sans-serif;
  --body:'Gowun Dodum','Apple SD Gothic Neo','Noto Sans KR','Noto Sans CJK KR','Malgun Gothic',sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden}
body{background:#e3f0ff;color:var(--ink);font-family:var(--body);word-break:keep-all;overflow-wrap:anywhere;-webkit-text-size-adjust:100%;text-size-adjust:100%;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-user-select:none;user-select:none;appearance:none;-webkit-appearance:none}
b,strong{font-family:var(--disp);font-weight:400}
kbd{font-family:"Malgun Gothic",sans-serif;font-size:13px;line-height:1.5;background:#fff;border:1.5px solid var(--line);border-bottom-width:3px;border-radius:6px;padding:0 7px;color:var(--soft);white-space:nowrap}
:focus-visible{outline:3px solid var(--royal);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.nojs{margin:24px 16px;padding:14px;background:#fff;border-radius:12px}

/* ===== 무대 =====
   무대(.app)는 기준 크기로 그린 뒤 transform으로 줄이거나 키운다. 줄이기 전 크기가 화면보다 크면 폰 브라우저가 페이지를 넓게 잡으므로,
   화면에 붙은 틀(.stage) 안에 두고 넘치는 것은 잘라 낸다. */
.stage{position:fixed;top:0;right:0;bottom:0;left:0;overflow:hidden}
.app{position:absolute;left:0;top:0;width:760px;height:320px;transform-origin:0 0;display:grid;grid-template-columns:58px minmax(0,1fr) 96px;grid-template-rows:minmax(0,1fr);overflow:hidden;font-size:15px;line-height:1.45;background:linear-gradient(165deg,#d6ebff 0%,#e9f4ff 55%,#f5faff 100%)}
.app.noact{grid-template-columns:58px minmax(0,1fr)}
.app.noact .act{display:none}

/* 왼쪽 띠: 뒤로 · 네 걸음 · 재료 */
.rail{background:var(--navy);display:flex;flex-direction:column;align-items:center;padding:8px 0 9px;gap:4px;min-height:0;min-width:0}
.bk{flex:none;width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.16);color:#fff;display:grid;place-items:center;font-family:var(--disp);font-size:19px;line-height:1;padding:0}
.bk:active{background:rgba(255,255,255,.3)}
.pbrand,.tlink,.subs{display:none}
.ph{position:relative;list-style:none;margin:0;padding:0;flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:5px;cursor:pointer}
.ph::before{content:'';position:absolute;left:50%;top:50%;height:150px;margin:-82px 0 0 -1px;width:2px;background:#3a4767}
.ph > li{position:relative;display:flex;flex-direction:column;align-items:center}
.phb{border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:1px;color:inherit}
.phb i{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:17px;line-height:1;background:#46537a}
.phb b{font-size:11.5px;line-height:1.2;color:#a9b7d3;background:var(--navy);padding:0 3px}
.ph > li.t .phb i{filter:saturate(.75)}
.ph > li.d .phb i{background:var(--teal);color:#fff;font-family:var(--disp);font-size:16px}
.ph > li.d .phb b{color:#a9e2d9}
.ph > li.c .phb i{background:var(--cta);box-shadow:0 0 0 3px rgba(255,204,51,.3)}
.ph > li.c .phb b{color:var(--cta)}
.rfoot{flex:none;display:flex;flex-direction:column;align-items:center}
.matb{display:flex;flex-direction:column;align-items:center;line-height:1.1;font-family:var(--disp)}
.matb b{font-size:16px;color:var(--cta)}
.matb small{font-size:11px;color:#93a3c2}

/* 가운데: 질문은 위, 답은 그 아래 가득 */
.ct{min-width:0;min-height:0;display:flex;flex-direction:column;gap:8px;padding:10px 14px 12px}
.hd{flex:none;display:flex;flex-direction:column;gap:3px;min-width:0}
.hd:empty{display:none}
.hd.center{align-items:center;text-align:center}
.crumb{display:flex;align-items:center;gap:8px;font-family:var(--disp);font-size:13px;line-height:1.3;color:var(--blue)}
.dots{display:inline-flex;gap:4px;align-items:center}
.dots i{width:7px;height:7px;border-radius:50%;background:#bdd0ec}
.dots i.d{background:var(--teal)}
.dots i.c{width:18px;border-radius:4px;background:var(--cta-d)}
.hd h1{margin:0;font-family:var(--disp);font-weight:400;font-size:23px;line-height:1.25;outline:none}
.hd .help{margin:0;font-size:14px;color:var(--soft)}
.hdrow{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.cnt{flex:none;font-family:var(--disp);font-size:13px;color:var(--blue);background:#fff;border-radius:999px;padding:4px 12px;box-shadow:0 2px 0 var(--line2);white-space:nowrap}
.an{flex:1;min-height:0;min-width:0;display:flex;flex-direction:column;gap:8px}
.an.mid{justify-content:center}
.an.scroll{overflow-y:auto}
.app.tight .an{zoom:.9}
.app.tight2 .an{zoom:.8}
.note{margin:0;font-size:13px;color:var(--mute)}

/* 오른쪽: 큰 단추 하나 */
.act{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;padding-right:12px;min-width:0}
.act .prev,.act .keys,.go .gl,.go kbd{display:none}
.go{order:1;flex:none;width:78px;height:78px;border-radius:50%;border:0;background:var(--cta);box-shadow:0 5px 0 var(--cta-d);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:var(--disp);font-size:19px;line-height:1.1;color:var(--navy);text-align:center;padding:0}
.go i{font-style:normal;font-size:13px;line-height:1}
.go:active{transform:translateY(3px);box-shadow:0 2px 0 var(--cta-d)}
.go:disabled{background:#e4eaf4;box-shadow:0 5px 0 #cbd5e5;color:#8a96ac;cursor:not-allowed;transform:none}
.go.sm{font-size:16.5px}
.go.big{width:96px;height:96px;font-size:25px}
.act .sub{order:2;border:0;background:none;font-size:12.5px;line-height:1.3;color:var(--mute);text-align:center;text-decoration:underline;padding:7px 4px}
.act .sub.teal{font-family:var(--disp);font-size:13.5px;line-height:1.2;color:var(--teal);background:var(--teal-soft);border-radius:14px;padding:8px 9px;text-decoration:none}
.anote{order:3;font-size:12.5px;line-height:1.3;color:var(--mute);text-align:center}
.anote:empty{display:none}

/* 고르기: 그림 카드와 글 카드 */
.tiles{flex:1;min-height:0;display:grid;grid-template-columns:repeat(var(--cols,3),minmax(0,1fr));grid-auto-rows:minmax(0,1fr);gap:8px}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:#fff;border:2px solid var(--line);border-radius:16px;box-shadow:0 4px 0 var(--line);text-align:center;padding:6px 8px;min-width:0;min-height:0;color:var(--ink)}
button.tile:active{transform:translateY(2px);box-shadow:0 2px 0 var(--line)}
.tile .tl{font-family:var(--disp);font-size:16.5px;line-height:1.25}
.tile small{font-size:12.5px;line-height:1.3;color:var(--mute)}
.tile .pic{flex:none;width:58px;height:58px;border-radius:50%;background:var(--sky2);display:grid;place-items:center;font-size:33px;line-height:1;margin-bottom:2px}
.tiles.r2 .tile .pic{width:38px;height:38px;font-size:22px;margin:0}
.tile.on{background:var(--cta-soft);border-color:var(--cta-d);box-shadow:0 4px 0 var(--cta-d)}
.tile.on .pic{background:#fff}
.tile .mk{position:absolute;right:7px;top:7px;width:22px;height:22px;border-radius:50%;background:var(--cta-d);color:#fff;display:none;place-items:center;font-family:var(--disp);font-size:13px;line-height:1}
.tile.on .mk{display:grid}
.tile .k{display:none}
.tile .num{position:absolute;left:8px;top:8px;width:24px;height:24px;border-radius:50%;background:var(--cta);display:grid;place-items:center;font-family:var(--disp);font-size:14px}
.more{flex:none;display:flex;gap:8px;align-items:center}
.ghostb{font-family:var(--disp);font-size:14px;line-height:1.2;padding:9px 15px;border-radius:999px;background:#fff;border:2px solid var(--line);color:var(--navy);white-space:nowrap}
.ghostb.strong{background:var(--cta);border-color:var(--cta-d)}
.ghostb.on{background:var(--cta-soft);border-color:var(--cta-d)}

/* 시작 */
.app.start{grid-template-columns:minmax(0,1fr) 134px}
.app.start .rail{display:none}
.app.start .ct{padding:12px 6px 12px 28px;justify-content:center}
.app.start .an{flex:none;gap:0}
.eyebrow2{font-family:var(--disp);font-size:13.5px;color:var(--blue)}
.title{margin:1px 0 3px;font-family:var(--disp);font-weight:400;font-size:52px;line-height:1.05;color:var(--navy);outline:none}
.title span{display:inline-block;vertical-align:middle;margin-left:10px;font-size:16px;background:var(--cta);border-radius:999px;padding:4px 13px}
.lede{margin:0 0 12px;font-size:16px}
.road{display:flex;align-items:stretch;gap:5px}
.road div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;background:#fff;border-radius:16px;box-shadow:0 4px 0 var(--line);padding:9px 4px 10px;text-align:center}
.road i{font-style:normal;font-size:29px;line-height:1.15}
.road b{font-size:17px;line-height:1.2}
.road small{font-size:12.5px;color:var(--mute)}
.road em{align-self:center;font-style:normal;font-family:var(--disp);font-size:20px;color:#9fb3d4}
.foot2{margin-top:12px;display:flex;align-items:center;gap:16px;font-size:13px;color:var(--mute)}
.tlink2{border:0;background:none;padding:6px 0;font-size:13px;color:var(--mute);text-decoration:underline}
.sianv{margin-left:auto;font-family:var(--disp);font-size:12px;color:var(--cta);background:var(--navy);border-radius:999px;padding:2px 10px}

/* 오늘 배우는 것 · 약속 */
.goalcards{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.goalc{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:#fff;border-radius:18px;box-shadow:0 4px 0 var(--line);padding:10px 14px;text-align:center;font-size:15.5px;line-height:1.45}
.goalc b{flex:none;width:38px;height:38px;border-radius:50%;background:var(--cta);display:grid;place-items:center;font-size:20px;line-height:1}
.pledges{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:minmax(0,1fr);gap:10px}
.pl{display:flex;align-items:center;gap:12px;text-align:left;background:#fff;border:2px solid var(--line);border-radius:16px;box-shadow:0 3px 0 var(--line);padding:6px 14px;font-size:15.5px;line-height:1.4;color:var(--ink)}
.pl i{flex:none;width:30px;height:30px;border-radius:9px;border:2.5px solid var(--line);display:grid;place-items:center;font-style:normal;font-family:var(--disp);font-size:17px;line-height:1;color:transparent;background:#fff}
.pl.on{border-color:var(--teal);box-shadow:0 3px 0 var(--teal);background:#f2fbf9}
.pl.on i{background:var(--teal);border-color:var(--teal);color:#fff}

/* 둘 중 하나 */
.vsrow{flex:1;min-height:0;display:grid;grid-template-columns:1fr 44px 1fr;gap:10px}
.vcard{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-radius:24px;border:3px solid;text-align:center;padding:8px;color:var(--ink);min-width:0}
.vcard.a{background:#e7f2ff;border-color:#9cc1f2;box-shadow:0 5px 0 #9cc1f2}
.vcard.b{background:#fff1e3;border-color:#f3bb86;box-shadow:0 5px 0 #f3bb86}
.vcard:active{transform:translateY(3px)}
.vcard i{font-style:normal;font-size:64px;line-height:1.1}
.vcard .tl{font-family:var(--disp);font-size:23px;line-height:1.25}
.vcard.on::after{content:'✓ 고른 것';position:absolute;right:12px;top:10px;font-family:var(--disp);font-size:13px;color:#fff;background:var(--navy);border-radius:999px;padding:2px 10px}
.vcard .k{display:none}
.vs{align-self:center;width:44px;height:44px;border-radius:50%;background:var(--navy);color:var(--cta);font-family:var(--disp);font-size:15px;display:grid;place-items:center}
.hint{flex:none;margin:0;text-align:center;font-size:13px;color:var(--mute)}

/* 글 쓰기 */
.ask{display:flex;align-items:center;gap:13px;margin-top:2px}
.avatar{flex:none;width:58px;height:58px;border-radius:50%;background:var(--cta-soft);border:3px solid var(--cta-d);display:grid;place-items:center;font-size:32px;line-height:1}
.bubble{position:relative;background:#fff;border-radius:18px;padding:8px 16px 9px;box-shadow:0 3px 0 var(--line)}
.bubble::before{content:'';position:absolute;left:-9px;top:50%;margin-top:-9px;border:9px solid transparent;border-left:0;border-right-color:#fff}
.bubble h1{font-size:23px}
.bubble small{display:block;font-size:13.5px;color:var(--soft)}
.fieldblk{display:flex;flex-direction:column;gap:6px;min-width:0}
.fieldblk.grow{flex:1;min-height:0}
.kbq,.kbok{display:none}
.flabel{font-family:var(--disp);font-size:14.5px;line-height:1.3;color:var(--soft)}
.frow{flex:none;display:flex;gap:8px;align-items:stretch;min-height:0}
.fieldblk.grow .frow{flex:1}
.frow input,.frow textarea{flex:1;min-width:0;border:2.5px solid var(--line);border-radius:16px;background:#fff;outline:none;resize:none}
.frow input{height:56px;padding:0 16px;font-size:21px}
.frow textarea{height:76px;padding:9px 14px;font-size:17px;line-height:1.55}
.fieldblk.grow .frow textarea{height:auto}
.frow input:focus,.frow textarea:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(47,98,201,.12)}
.frow ::placeholder{color:#9aa5b8}
.warn{margin:0;padding:6px 12px;border-radius:12px;background:var(--pop-soft);color:var(--pop);font-size:13.5px;line-height:1.4}
.idea-l{font-size:13px;color:var(--mute)}
.ideas{display:flex;flex-wrap:wrap;gap:8px}
.idea{font-size:16px;line-height:1.2;padding:11px 17px;border-radius:999px;background:#fff;border:2px solid var(--line);box-shadow:0 3px 0 var(--line);color:var(--ink);text-align:left}
.idea.on{background:var(--cta-soft);border-color:var(--cta-d);box-shadow:0 3px 0 var(--cta-d)}
.fieldblk.side{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;column-gap:12px;row-gap:4px;flex:1;min-height:0}
.fieldblk.side .frow{grid-column:1;grid-row:1 / 3}
.fieldblk.side .frow textarea{height:auto}
.fieldblk.side .warn{grid-column:1;grid-row:3}
.fieldblk.side .idea-l{grid-column:2;grid-row:1}
.fieldblk.side .ideas{grid-column:2;grid-row:2 / 4;flex-direction:column;flex-wrap:nowrap;gap:6px;min-height:0}
.fieldblk.side .idea{border-radius:14px;font-size:14.5px;line-height:1.35;padding:8px 12px;flex:0 1 auto}
.cols2{flex:1;min-height:0;display:grid;grid-template-columns:repeat(var(--cols,2),minmax(0,1fr));gap:12px;align-content:center}

/* 자판이 열렸을 때(폰 · 태블릿): 글 칸만 화면 위쪽에 남긴다 */
.pcx{display:none}
.pc .pcx{display:inline}
.kb .app .fieldblk.kbkeep{position:absolute;left:0;right:0;top:var(--vvt,0px);height:var(--vvh,144px);z-index:40;background:#e3f0ff;padding:7px 12px;gap:6px;display:flex;flex-direction:column}
.kb .app .kbkeep .kbq{display:block;flex:none;font-family:var(--disp);font-size:16px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kb .app .kbkeep .kbok{display:block;flex:none;align-self:center;border:0;font-family:var(--disp);font-size:17px;background:var(--cta);box-shadow:0 4px 0 var(--cta-d);border-radius:16px;padding:12px 16px;color:var(--navy)}
.kb .app .kbkeep .flabel,.kb .app .kbkeep .idea-l,.kb .app .kbkeep .strow{display:none}
.kb .app .kbkeep .frow{flex:none;grid-column:auto;grid-row:auto}
.kb .app .kbkeep.area .frow{flex:1;min-height:0}
.kb .app .kbkeep .frow input{height:46px;font-size:19px}
.kb .app .kbkeep .frow textarea{height:auto;font-size:16px;line-height:1.5;padding:7px 12px}
.kb .app .kbkeep .ideas{flex:none;flex-direction:row;flex-wrap:nowrap;overflow:hidden;gap:6px}
.kb .app .kbkeep .idea{flex:none;padding:5px 12px;font-size:14px;line-height:1.3;white-space:nowrap;box-shadow:none;border-radius:999px}
.kb .app .kbkeep .matrow{flex-wrap:nowrap;overflow:hidden}
.kb .app .kbkeep .matchip{flex:none;padding:5px 10px}
.kb .app .kbkeep .matchip small{display:none}
.kb .devbar{display:none}

/* 놀이: 놀이판은 가운데, 누르는 단추는 오른손, 점수와 안내는 왼쪽 */
.app.game{grid-template-columns:minmax(0,1fr)}
.app.game .rail,.app.game .act,.app.game .hd{display:none}
.app.game .ct{padding:0}
.gscreen{display:grid;height:100%;grid-template-columns:190px auto minmax(214px,1fr);grid-template-rows:auto auto auto auto auto minmax(0,1fr) auto;grid-template-areas:"top arena pad" "ttl arena pad" "hud arena pad" "msg arena pad" "leg arena pad" ". arena pad" "skip arena pad";column-gap:12px;row-gap:8px;padding:10px 14px 12px}
.g-run .gscreen{grid-template-columns:190px auto minmax(150px,1fr)}
.groot{display:contents}
.gtop{grid-area:top;display:flex;align-items:center;gap:8px}
.bk.lt{background:#fff;color:var(--navy);box-shadow:0 2px 0 var(--line)}
.gtag{font-family:var(--disp);font-size:13px;line-height:1.3;background:var(--navy);color:#fff;border-radius:999px;padding:3px 11px}
.gscreen h1{grid-area:ttl;margin:2px 0 0;font-family:var(--disp);font-weight:400;font-size:26px;line-height:1.2;outline:none}
.gscreen .hud{grid-area:hud}
.gscreen .gmsg{grid-area:msg}
.gscreen .glegend{grid-area:leg}
.gscreen .skip{grid-area:skip;justify-self:start;border:0;background:none;padding:6px 0;font-size:13px;color:var(--mute);text-decoration:underline}
.gscreen .arena{grid-area:arena;align-self:center}
.gscreen .pad{grid-area:pad;align-self:center;justify-self:center}
.pchint{display:none}
.hud{display:flex;align-items:center;gap:8px;font-family:var(--disp)}
.scorebox{font-size:19px;line-height:1.4;background:var(--cta);border-radius:12px;padding:2px 12px;white-space:nowrap}
.timebar{flex:1;height:14px;border:2px solid var(--line);border-radius:999px;background:#fff;overflow:hidden}
.timebar i{display:block;height:100%;width:100%;background:var(--blue)}
.hudnote{font-family:var(--body);font-size:13.5px;color:var(--mute)}
.gmsg{margin:0;font-size:15px;line-height:1.45;min-height:1.45em}
.glegend{margin:0;font-size:13.5px;color:var(--soft)}
.arena{position:relative;border-radius:20px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;background:radial-gradient(circle at 20% 15%,rgba(255,255,255,.14) 1.5px,transparent 2.5px) 0 0/40px 40px,var(--arena,var(--night))}
.gscreen .arena.maze,.gscreen .arena.whack{width:min(calc(var(--lh,320px) - 22px),calc(var(--lw,760px) - 456px));aspect-ratio:1}
.gscreen .arena.dodge{height:calc(var(--lh,320px) - 22px);max-width:calc(var(--lw,760px) - 456px);aspect-ratio:9/10}
.gscreen .arena.run{width:min(calc((var(--lh,320px) - 22px)*1.6),calc(var(--lw,760px) - 392px));aspect-ratio:16/10}
.arena.maze{padding:6px}
.arena.whack{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px}
.count{position:absolute;top:0;right:0;bottom:0;left:0;z-index:3;display:grid;place-items:center;font-family:var(--disp);font-size:66px;color:#fff;background:rgba(31,42,68,.62)}
.obj{position:absolute;left:0;top:0;font-size:28px;line-height:1;will-change:transform;pointer-events:none}
.player{position:absolute;left:0;bottom:3%;display:flex;flex-direction:column;align-items:center;will-change:transform;pointer-events:none}
.player .pe{font-size:38px;line-height:1}
.player .pn,.rhero .pn{font-family:var(--disp);font-size:12px;color:#fff;background:rgba(0,0,0,.4);border-radius:999px;padding:0 7px;white-space:nowrap}
.player .pn{margin-top:2px}
.player.inv,.rhero.inv{opacity:.4}
.arena.shake{animation:shake .25s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(7,1fr);width:100%;height:100%}
.mgrid span{display:grid;place-items:center;font-size:24px;line-height:1;min-width:0;min-height:0}
.mgrid .w{background:var(--accent,#40507c);border-radius:7px;margin:1.5px}
.rground{position:absolute;left:0;right:0;bottom:0;height:22%;background:var(--accent,#40507c)}
.rhero{position:absolute;left:18%;bottom:22%;width:0;display:flex;flex-direction:column-reverse;align-items:center;will-change:transform;pointer-events:none}
.rhero .pe{font-size:34px;line-height:1}
.rhero .pn{margin-bottom:2px}
.robj{position:absolute;left:0;bottom:22%;margin-left:-.5em;font-size:27px;line-height:1;will-change:transform;pointer-events:none}
.robj.star{bottom:52%}
.hole{border:0;border-radius:16px;background:var(--accent,#2c3a5e);box-shadow:inset 0 -7px 0 rgba(0,0,0,.18);position:relative;overflow:hidden;padding:0}
.hole.hit{background:var(--cta)}
.hole.bad{background:var(--pop)}
.pop{position:absolute;top:0;right:0;bottom:0;left:0;display:grid;place-items:center;font-size:40px;transform:translateY(108%);transition:transform .09s ease-out;pointer-events:none}
.hole.up .pop{transform:none}
.pad{display:flex;gap:12px}
.padbtn{flex:none;width:84px;height:84px;border-radius:50%;border:0;background:var(--cta);box-shadow:0 5px 0 var(--cta-d);color:var(--navy);font-size:26px;line-height:1;padding:0;touch-action:none;display:flex;align-items:center;justify-content:center;white-space:nowrap;overflow-wrap:normal}
.padbtn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--cta-d)}
.dpad{display:grid;grid-template-columns:repeat(3,62px);grid-template-rows:repeat(3,62px);gap:4px;grid-template-areas:". up ." "left . right" ". down ."}
.dpad .padbtn{width:62px;height:62px;font-size:21px}
.dpad [data-m="-1,0"]{grid-area:up}.dpad [data-m="0,-1"]{grid-area:left}.dpad [data-m="1,0"]{grid-area:down}.dpad [data-m="0,1"]{grid-area:right}
.padbtn.jump{width:112px;height:112px;font-family:var(--disp);font-size:23px}
/* 빠르기 실험 */
.app.lab .gscreen{grid-template-rows:auto auto auto minmax(0,1fr) auto;grid-template-areas:"top arena pad" "ttl arena pad" "seg arena pad" ". arena pad" "go arena pad"}
.app.lab .gscreen h1{font-size:17px;line-height:1.3}
.app.lab .hud,.app.lab .gmsg,.app.lab .glegend{display:none}
.seg{grid-area:seg;display:flex;flex-direction:column;gap:6px}
.seg button{height:38px;border-radius:12px;border:2px solid var(--line);background:#fff;font-family:var(--disp);font-size:16px;color:var(--ink);padding:0 8px}
.seg button[aria-pressed="true"]{background:var(--cta);border-color:var(--cta-d)}
.seg.row{flex-direction:row}
.seg.row button{flex:1;height:56px;font-size:19px}
.gconfirm{grid-area:go;border:0;height:46px;border-radius:16px;background:var(--cta);box-shadow:0 4px 0 var(--cta-d);font-family:var(--disp);font-size:16px;color:var(--navy);padding:0 8px}
/* 미리 해 볼 수 없는 놀이의 그림 */
.stubwrap{flex:1;min-height:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center}
.stub{--c1:#1f2a44;--c2:#ffcc33;width:250px;border-radius:16px;background:var(--c1);overflow:hidden}
.stub.match{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:10px}
.stub .mc{aspect-ratio:3/4;border-radius:9px;background:var(--c2);display:grid;place-items:center;font-size:22px}
.stub .mc.open{background:#fff}
.stub.quiz{display:flex;flex-direction:column;gap:8px;align-items:center;padding:18px;color:#fff;font-family:var(--disp)}
.stub.quiz .qh{font-size:40px;line-height:1}
.stub.quiz .qb{background:#fff;color:var(--ink);border-radius:12px;padding:6px 14px}
.stub.quiz .qo{letter-spacing:6px;color:var(--c2)}
.sianbox{font-size:15px;line-height:1.5;border:1.5px dashed #9fb3c9;border-radius:14px;padding:10px 14px;color:var(--soft);background:rgba(255,255,255,.7)}

/* 내 놀이 카드 · 한 판 안내 */
.gcard{flex:1;min-height:0;display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:10px;align-items:stretch}
.gcard > div{display:flex;flex-direction:column;justify-content:center;gap:3px;border-radius:18px;padding:10px 14px;background:#fff;box-shadow:0 4px 0 var(--line)}
.gcard > .main{background:var(--navy);color:#fff;box-shadow:0 4px 0 #111a2e}
.gcard small{font-size:13px;color:var(--mute)}
.gcard .main small{color:#c9d6ee}
.gcard b{font-size:20px;line-height:1.25}
.gcard .main b{font-size:25px;color:var(--cta)}
.gcard .nick{font-size:13.5px;color:#c9d6ee;margin-top:4px}
.gcard .nick b{font-size:16px;color:#fff}
.showcase{flex:1;min-height:0;display:flex;align-items:center;gap:18px;border-radius:22px;padding:14px 20px;background:radial-gradient(circle at 20% 15%,rgba(255,255,255,.14) 1.5px,transparent 2.5px) 0 0/40px 40px,var(--arena,var(--night));color:#fff}
.showcase .big{flex:none;font-size:82px;line-height:1}
.showcase p{margin:0;font-size:16.5px;line-height:1.5}
.showcase .chipl{display:inline-block;margin-bottom:6px;font-family:var(--disp);font-size:13.5px;color:var(--navy);background:var(--cta);border-radius:999px;padding:2px 12px}
.showcase.light{color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}

/* 상상 칸의 장치들 */
.emo{flex:1;min-height:0;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));grid-auto-rows:minmax(0,1fr);gap:6px}
.em{border:2px solid var(--line);border-radius:14px;background:#fff;font-size:30px;line-height:1;padding:0}
.em[aria-pressed="true"]{background:var(--cta-soft);border-color:var(--cta-d);box-shadow:0 0 0 2px var(--cta-d)}
.drawrow{flex:none;display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:stretch}
.dcard{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:84px;padding:8px 10px;border:2px solid #7fcfc4;border-radius:18px;background:#d9f4ef;box-shadow:0 4px 0 #7fcfc4;text-align:center;color:var(--ink)}
.dcard small{font-family:var(--disp);font-size:12.5px;background:#fff;border-radius:999px;padding:0 10px;color:var(--teal)}
.dcard b{font-size:20px;line-height:1.25}
.dcard.flip{animation:flip .32s ease-out}
@keyframes flip{0%{transform:rotateY(90deg) scale(.96)}100%{transform:none}}
.drawbtn{border:0;border-radius:18px;background:var(--cta);box-shadow:0 4px 0 var(--cta-d);font-family:var(--disp);font-size:16px;line-height:1.25;color:var(--navy);padding:8px 16px}
.twrow{flex:1;min-height:0;display:grid;grid-template-columns:210px minmax(0,1fr);gap:12px}
.dcard.tw{min-height:0;background:#ffe9d6;border-color:#f0b98a;box-shadow:0 4px 0 #f0b98a}
.dcard.tw small{color:#b3590f}
.dcard.tw b{font-size:15.5px;line-height:1.45}
.sws{flex:1;min-height:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-auto-rows:minmax(0,1fr);gap:8px}
.swb{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:2px solid var(--line);border-radius:16px;background:#fff;box-shadow:0 3px 0 var(--line);padding:4px 2px;font-family:var(--disp);font-size:14.5px;color:var(--ink)}
.swb i{width:36px;height:36px;border-radius:50%;border:2px solid rgba(31,42,68,.18)}
.swb[aria-pressed="true"]{background:var(--cta-soft);border-color:var(--cta-d);box-shadow:0 3px 0 var(--cta-d)}
.swb .mk{position:absolute;right:6px;top:6px;width:20px;height:20px;border-radius:50%;background:var(--cta-d);color:#fff;display:none;place-items:center;font-size:12px;line-height:1}
.swb[aria-pressed="true"] .mk{display:grid}
.cols3{flex:1;min-height:0;display:grid;grid-template-columns:1.15fr 1.05fr .9fr;gap:10px}
.ncard{display:flex;flex-direction:column;background:#fff;border:2px solid var(--line);border-radius:18px;box-shadow:0 4px 0 var(--line);padding:9px 12px 10px;gap:4px;min-width:0}
.ncard header{display:flex;align-items:center;gap:6px;font-family:var(--disp);font-size:16.5px;line-height:1.3}
.ncard header i{font-style:normal;font-size:17px}
.ncard .midc{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}
.hearts{display:flex;gap:1px}
.hearts button{width:35px;height:42px;border:0;background:none;padding:0;display:grid;place-items:center;font-size:30px;line-height:1;color:#d5dcea}
.hearts button.f{color:#e2485f}
.val{font-family:var(--disp);font-size:20px;line-height:1.2}
.optg{display:grid;gap:6px;width:100%}
.optg.g2{grid-template-columns:1fr 1fr}
.optg button{display:grid;place-items:center;height:42px;border-radius:12px;border:2px solid var(--line);background:#fff;font-family:var(--disp);font-size:17px;color:var(--ink);padding:0}
.optg button[aria-pressed="true"]{background:var(--cta-soft);border-color:var(--cta-d)}

/* 엮기 */
.oneline{flex:none;align-self:flex-start;max-width:100%;font-size:17px;line-height:1.4;background:#fff;border:2px dashed #9fb3c9;border-radius:14px;padding:6px 14px}
.reveal{flex:none;margin:0;font-size:14px;line-height:1.45;background:var(--cta-soft);border:2px solid var(--cta-d);border-radius:14px;padding:6px 12px}
.matrow{flex:none;display:flex;flex-wrap:wrap;gap:6px}
.matchip{display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding:3px 9px 4px;border-radius:12px;border:2px solid var(--line);background:#fff;line-height:1.2;white-space:nowrap;color:var(--ink)}
.matchip small{font-size:11.5px;color:var(--mute)}
.matchip b{font-size:15px}
.matchip.in{background:var(--teal-soft);border-color:#8fd3c8}
.matchip.in b::after{content:' ✓';color:var(--teal)}
.strow{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13.5px;color:var(--soft)}
.pips{display:inline-flex;gap:3px;margin-right:8px;vertical-align:-1px}
.pips i{width:12px;height:12px;border-radius:4px;background:#d5dfef}
.pips i.on{background:var(--teal)}
.paper{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px;background:#fff;border:2px solid var(--line);border-radius:18px;box-shadow:0 4px 0 var(--line);padding:9px 12px 10px 14px;overflow:hidden}
.paper header{flex:none;display:flex;align-items:center;gap:8px}
.paper header b{font-size:15px;line-height:1.5;color:#fff;background:var(--blue);border-radius:9px;padding:2px 11px}
.paper header em{font-style:normal;font-family:var(--disp);font-size:13px;color:var(--teal)}
.editb{font-family:var(--disp);font-size:14px;line-height:1.2;padding:8px 14px;border-radius:999px;background:var(--sky2);border:2px solid var(--line);color:var(--navy);white-space:nowrap}
.paper .editb{margin-left:auto}
.paper p{flex:1;min-height:0;margin:0;font-size:16.5px;line-height:1.6;overflow:hidden}
.paper p.s1{font-size:15px;line-height:1.55}
.paper p.s2{font-size:13.5px;line-height:1.5}
.paper p.s3{font-size:13.5px;line-height:1.5;overflow-y:auto}
.pager{flex:none;display:flex;align-items:center;gap:6px}
.pager button{flex:none;min-width:28px;height:28px;border-radius:14px;display:inline-flex;align-items:center;justify-content:center;gap:5px;font-family:var(--disp);font-size:13.5px;line-height:1;background:#fff;border:2px solid var(--line);color:var(--mute);padding:0 4px}
.pager button span{display:none}
.pager button.d{background:var(--teal-soft);border-color:var(--teal);color:var(--teal)}
.pager button.c{background:var(--cta);border-color:var(--cta-d);color:var(--navy);padding:0 12px}
.pager button.c span{display:inline}
.pager button em{display:none}
.pager .tip{margin-left:auto;font-size:13px;color:var(--mute);white-space:nowrap}
.grow2{flex:none;display:flex;align-items:center;gap:8px}
.gbox{display:flex;flex-direction:column;background:#fff;border-radius:14px;box-shadow:0 3px 0 var(--line2);padding:5px 12px 6px;line-height:1.25;min-width:0}
.gbox small{font-family:var(--disp);font-size:12px;color:var(--mute)}
.gbox b{font-size:16px;white-space:nowrap}
.gbox.now{background:var(--cta-soft);box-shadow:0 3px 0 var(--cta-d)}
.gbox.now b{font-size:21px}
.garr{font-family:var(--disp);color:var(--mute);font-size:18px}
.grow2 .cnt{margin-left:auto}
.pv{position:relative;flex:1;min-height:0;overflow:hidden;background:#fff;border:2px solid var(--line);border-radius:16px;padding:9px 13px}
.pv p{margin:0 0 5px;font-size:14.5px;line-height:1.55}
.pv::after{content:'';position:absolute;left:0;right:0;bottom:0;height:52%;background:linear-gradient(rgba(255,255,255,0),#fff 82%);pointer-events:none}
.pv .editb{position:absolute;right:10px;bottom:9px;z-index:1}
.ptag{display:inline-block;font-family:var(--disp);font-size:12.5px;line-height:1.5;color:#fff;background:var(--blue);border-radius:7px;padding:0 7px;margin-right:6px}
.todo3{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:2px 7px;font-size:13px;line-height:1.5;color:var(--soft)}
.todo3 b{display:inline-grid;place-items:center;width:19px;height:19px;border-radius:50%;background:var(--navy);color:#fff;font-size:11.5px;line-height:1;margin-right:5px;vertical-align:1px}
.todo3 em{font-style:normal;color:#9fb3d4}

/* 확인 */
.app.check{grid-template-columns:58px minmax(0,1fr) 120px}
.steps9{flex:none;display:flex;gap:6px}
.steps9 button{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-family:var(--disp);font-size:13px;line-height:1;background:#fff;border:2px solid var(--line);color:var(--mute);padding:0}
.steps9 button span{display:none}
.steps9 button.o{background:var(--teal-soft);border-color:var(--teal);color:var(--teal)}
.steps9 button.x{background:var(--pop-soft);border-color:var(--pop);color:var(--pop)}
.steps9 button.c{background:var(--cta);border-color:var(--cta-d);color:var(--navy);box-shadow:0 0 0 2px #fff,0 0 0 4px var(--cta-d)}
.qbig{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:#fff;border:2px solid var(--line);border-radius:22px;box-shadow:0 4px 0 var(--line);padding:10px 26px;text-align:center}
.qbig small{font-family:var(--disp);font-size:14px;color:var(--blue)}
.qbig b{font-size:25px;line-height:1.35}
.act.ox{gap:14px;padding-right:16px}
.obtn,.xbtn{flex:none;width:86px;height:86px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-family:var(--disp);line-height:1.05;border:3px solid;background:#fff;padding:0}
.obtn{border-color:var(--teal);color:var(--teal);box-shadow:0 5px 0 var(--teal)}
.xbtn{border-color:var(--pop);color:var(--pop);box-shadow:0 5px 0 var(--pop)}
.obtn:active,.xbtn:active{transform:translateY(3px)}
.obtn[aria-pressed="true"]{background:var(--teal-soft)}
.xbtn[aria-pressed="true"]{background:var(--pop-soft)}
.obtn i,.xbtn i{font-style:normal;font-size:30px;line-height:1}
.obtn span,.xbtn span{font-size:14.5px}
.obtn .gl,.xbtn .gl{display:none}
.fixed{flex:none;margin:0;font-family:var(--disp);font-size:17px;line-height:1.35;color:var(--pop)}
.rbox{flex:1;min-height:0;overflow:hidden;border:2px solid var(--line);border-radius:16px;padding:10px 14px;background:#fff;font-size:16.5px;line-height:1.6}
.donegrid{flex:1;min-height:0;display:grid;grid-template-columns:1.25fr 1fr;gap:12px}
.did{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;justify-content:center;gap:5px}
.did li{position:relative;padding:5px 12px 5px 34px;background:#fff;border:2px solid var(--line2);border-radius:13px;font-size:14px;line-height:1.4}
.did li::before{content:'✓';position:absolute;left:11px;top:5px;font-family:var(--disp);color:var(--teal)}
.cando{display:flex;flex-direction:column;justify-content:center;gap:4px;background:var(--navy);color:#fff;border-radius:18px;padding:10px 14px}
.cando h2{margin:0;font-family:var(--disp);font-weight:400;font-size:16px;color:var(--cta)}
.cando ol{margin:0;padding-left:1.2em;font-size:13.5px;line-height:1.5}
.endbtns{order:2;display:flex;flex-direction:column;gap:8px}

/* 열리는 창 · 알림 · 시안 도구 */
.sheetwrap{position:absolute;top:0;right:0;bottom:0;left:0;z-index:60;background:rgba(31,42,68,.45);display:flex}
.sheet2{flex:1;margin:8px;background:#fff;border-radius:18px;display:flex;flex-direction:column;padding:10px 16px 12px;gap:8px;min-height:0;min-width:0;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.sheet2 > header{flex:none;display:flex;align-items:center;gap:12px}
.sheet2 > header b{font-size:19px;line-height:1.3}
.sheet2 > header span{font-size:13px;color:var(--mute)}
.sheet2 .x{margin-left:auto;flex:none;border:0;width:38px;height:38px;border-radius:50%;background:var(--sky2);font-family:var(--disp);font-size:16px;line-height:1;color:var(--navy);padding:0}
.sbody{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:8px;font-size:15px;line-height:1.55}
.sbody p{margin:0}
.srow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.fcols{flex:1;min-height:0;display:grid;grid-template-columns:1.08fr 1.16fr .9fr .9fr;gap:9px}
.fcol{display:flex;flex-direction:column;gap:3px;border-radius:16px;background:var(--sky2);padding:8px 10px;min-width:0}
.fcol.c{background:var(--cta-soft);box-shadow:inset 0 0 0 2px var(--cta-d)}
.fcol.d{background:var(--teal-soft)}
.fcol h3{margin:0 0 2px;display:flex;align-items:center;gap:6px;font-family:var(--disp);font-weight:400;font-size:17px;line-height:1.3}
.fcol h3 i{font-style:normal;font-size:17px}
.fcol h3 small{margin-left:auto;font-family:var(--body);font-size:12px;color:var(--blue)}
.fcol ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1px}
.fcol li button{width:100%;display:flex;align-items:baseline;gap:6px;border:0;background:none;padding:1px 0;text-align:left;font-size:14px;line-height:1.5;color:var(--mute);white-space:nowrap}
.fcol li button:disabled{cursor:default}
.fcol li button::before{content:'○';flex:none;font-size:11px}
.fcol li.d button{color:var(--ink)}
.fcol li.d button::before{content:'✓';color:var(--teal);font-family:var(--disp);font-size:13px}
.fcol li.c button{font-family:var(--disp);color:var(--ink)}
.fcol li.c button::before{content:'●';color:var(--cta-d)}
.fcol li em{margin-left:auto;font-style:normal;font-family:var(--body);font-size:12.5px;color:var(--blue);overflow:hidden;text-overflow:ellipsis}
.jumpgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.jumpgrid button{border:2px solid var(--line2);border-radius:12px;background:var(--sky2);padding:7px 8px;font-size:13.5px;line-height:1.3;text-align:left;color:var(--ink)}
.jumpgrid button.danger{background:var(--pop-soft);color:var(--pop)}
.tbody h3{margin:8px 0 2px;font-family:var(--disp);font-weight:400;font-size:16.5px;color:var(--blue)}
.tbody p.tn{color:var(--mute);font-size:13.5px}
.tbody ol,.tbody ul{margin:0;padding-left:1.2em}
.stds{list-style:none;padding:0!important;display:grid;grid-template-columns:1fr 1fr;gap:6px 14px}
.stds small{display:block;color:var(--blue);font-size:13px}
.fullp p{margin:0 0 6px}
.adult{font-size:14.5px;border-radius:14px;padding:8px 12px;background:var(--pop-soft)}
.toast{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);max-width:calc(100% - 40px);padding:10px 16px;border-radius:14px;z-index:70;background:var(--navy);color:#fff;font-family:var(--disp);font-size:15.5px;line-height:1.35;text-align:center}
.devbar{position:absolute;top:4px;right:5px;z-index:30;display:flex;gap:4px;opacity:.85}
.devbar button{border:1.5px dashed #9fb3c9;border-radius:9px;background:rgba(255,255,255,.9);color:var(--soft);font-family:var(--disp);font-size:11.5px;line-height:1.3;padding:3px 7px;white-space:nowrap}
.shot .devbar{display:none}
.rotate{position:fixed;top:0;right:0;bottom:0;left:0;z-index:100;display:grid;place-items:center;text-align:center;padding:24px;background:linear-gradient(165deg,#d6ebff 0%,#e9f4ff 55%,#f5faff 100%);font-family:var(--body);color:var(--ink)}
.rotate .rot{font-size:64px;line-height:1}
.rotate b{display:block;margin-top:14px;font-size:24px;line-height:1.3}
.rotate small{display:block;margin-top:8px;font-size:15px;color:var(--soft);line-height:1.5}
.rotate button{margin-top:18px;border:0;border-radius:16px;background:var(--cta);box-shadow:0 4px 0 var(--cta-d);font-family:var(--disp);font-size:17px;color:var(--navy);padding:12px 20px}

/* ===== PC (html.pc): 왼쪽 차례 칸 + 가운데 무대. 질문은 늘 위, '이전 · 다음'은 늘 아래 ===== */
.pc .app{grid-template-columns:244px minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;font-size:17px;line-height:1.5}
.pc .app.noact .act{display:flex}
.pc .rail,.pc .app.start .rail{grid-row:1 / 3;display:flex;align-items:stretch;background:#fff;border-right:2px solid var(--line2);padding:0;gap:0}
.pc .bk{display:none}
.pc .pbrand{display:block;background:var(--navy);color:#fff;padding:18px 20px 16px}
.pc .pbrand b{display:block;font-size:27px;line-height:1.15}
.pc .pbrand span{font-size:14px;color:#c9d6ee}
.pc .ph{justify-content:flex-start;padding:14px 12px;gap:6px;cursor:default}
.pc .ph::before{display:none}
.pc .ph > li{align-items:stretch;border-radius:16px;padding:8px 10px}
.pc .phb{flex-direction:row;gap:11px;width:100%;text-align:left}
.pc .phb i{width:36px;height:36px;font-size:19px;background:var(--sky2)}
.pc .phb b{font-size:19px;line-height:1.3;background:none;padding:0;color:var(--mute)}
.pc .ph > li.d .phb i{font-size:17px;background:var(--teal)}
.pc .ph > li.d .phb b{color:var(--soft)}
.pc .ph > li.c{background:var(--cta-soft)}
.pc .ph > li.c .phb i{box-shadow:none;background:var(--cta)}
.pc .ph > li.c .phb b{color:var(--ink)}
.pc .ph > li.c .subs{list-style:none;margin:6px 0 4px 47px;padding:0;display:flex;flex-direction:column;gap:3px}
.pc .subs li{display:flex;align-items:baseline;gap:8px;font-size:15px;line-height:1.4;color:var(--mute)}
.pc .subs li::before{content:'○';flex:none;font-size:11px}
.pc .subs li.d{color:var(--soft);cursor:pointer}
.pc .subs li.d:hover{text-decoration:underline}
.pc .subs li.d::before{content:'✓';font-family:var(--disp);font-size:14px;color:var(--teal)}
.pc .subs li.c{font-family:var(--disp);font-size:16px;color:var(--ink)}
.pc .subs li.c::before{content:'●';color:var(--cta-d)}
.pc .subs em{margin-left:auto;font-style:normal;font-family:var(--body);font-size:13px;color:var(--blue);white-space:nowrap;max-width:92px;overflow:hidden;text-overflow:ellipsis}
.pc .rfoot{flex-direction:row;justify-content:space-between;padding:12px 16px 14px;border-top:2px solid var(--line2)}
.pc .matb{flex-direction:row-reverse;gap:5px;align-items:center;background:var(--cta);border-radius:999px;padding:3px 12px;line-height:1.4}
.pc .matb b{font-size:15px;color:var(--navy)}
.pc .matb small{font-size:15px;color:var(--navy)}
.pc .tlink{display:block;border:0;background:none;padding:4px 0;font-size:14px;color:var(--mute);text-decoration:underline}
.pc .ct,.pc .app.start .ct{padding:30px 56px 0;gap:12px;justify-content:flex-start}
.pc .hd,.pc .an{width:100%;max-width:920px;margin-left:auto;margin-right:auto}
.pc .hd{gap:6px}
.pc .crumb{font-size:16px;gap:10px}
.pc .dots{gap:5px}
.pc .dots i{width:9px;height:9px}
.pc .dots i.c{width:24px;border-radius:5px}
.pc .hd h1{font-size:36px}
.pc .hd .help{font-size:18px}
.pc .cnt{font-size:16px;padding:5px 14px}
.pc .an,.pc .app.start .an{flex:1;justify-content:center;gap:16px}
.pc .note{font-size:15px}
.pc .act{grid-column:2;flex-direction:row;justify-content:flex-start;align-items:center;gap:12px;width:calc(100% - 112px);max-width:920px;justify-self:center;padding:8px 0 24px;min-height:94px}
.pc .act .prev{display:inline-flex;align-items:center;font-family:var(--disp);font-size:18px;line-height:1.2;padding:12px 22px;border-radius:16px;background:#fff;border:2px solid var(--line);color:var(--navy);white-space:nowrap}
.pc .act .keys{display:block;margin-left:auto;margin-right:4px;font-size:13.5px;color:var(--mute);white-space:nowrap}
.pc .act .keys kbd{margin:0 2px}
.pc .go,.pc .go.big,.pc .go.sm{order:0;width:auto;height:auto;border-radius:18px;flex-direction:row;gap:10px;font-size:22px;line-height:1.2;padding:14px 34px;white-space:nowrap}
.pc .go .gs,.pc .go i{display:none}
.pc .go .gl{display:inline}
.pc .go .gl::after{content:none}
.pc .go kbd{display:inline;background:rgba(255,255,255,.55);border-color:rgba(31,42,68,.25)}
.pc .go.nokey kbd{display:none}
.pc .go.nokey .gl::after{content:''}
.pc .act .sub,.pc .act .sub.teal{order:0;font-family:var(--disp);font-size:18px;line-height:1.2;padding:12px 22px;border-radius:16px;background:#fff;border:2px solid var(--line);color:var(--navy);text-decoration:none;white-space:nowrap}
.pc .act .sub.teal{border-color:var(--teal);color:var(--teal)}
.pc .act .sub br,.pc .anote br{display:none}
.pc .anote{order:0;font-size:15px}
.pc .tiles{flex:none;grid-auto-rows:auto;gap:14px}
.pc .tile{border-radius:22px;padding:22px 14px;gap:6px;box-shadow:0 5px 0 var(--line);min-height:92px}
.pc .tile .tl{font-size:22px}
.pc .tile small{font-size:15.5px}
.pc .tile .pic{width:104px;height:104px;font-size:58px;margin-bottom:6px}
.pc .tiles.r2 .tile .pic{width:60px;height:60px;font-size:34px}
.pc .tiles.pics .tile{min-height:270px}
.pc .tile.on{box-shadow:0 5px 0 var(--cta-d)}
.pc .tile .mk{width:28px;height:28px;font-size:16px;right:11px;top:11px}
.pc .tile .k{display:block;position:absolute;left:11px;top:11px}
.pc .tile .num{left:44px;top:10px;width:28px;height:28px;font-size:16px}
.pc .more{gap:10px}
.pc .ghostb{font-size:17px;padding:11px 20px}
.pc .vsrow{flex:none;height:350px;grid-template-columns:1fr 72px 1fr;gap:18px}
.pc .vcard{border-radius:34px;border-width:4px;gap:8px}
.pc .vcard.a{box-shadow:0 7px 0 #9cc1f2}
.pc .vcard.b{box-shadow:0 7px 0 #f3bb86}
.pc .vcard i{font-size:104px}
.pc .vcard .tl{font-size:34px}
.pc .vcard .k{display:block;position:absolute;left:16px;top:14px;font-size:15px}
.pc .vcard.on::after{font-size:16px;right:16px;top:14px}
.pc .vs{width:72px;height:72px;font-size:25px}
.pc .hint{font-size:16px}
.pc .goalcards{flex:none;height:250px;gap:16px}
.pc .goalc{font-size:19px;border-radius:24px;padding:18px 22px;gap:14px}
.pc .goalc b{width:52px;height:52px;font-size:26px}
.pc .pledges{flex:none;gap:12px;grid-auto-rows:auto}
.pc .pl{font-size:19px;padding:20px 20px;border-radius:20px;gap:14px}
.pc .pl i{width:34px;height:34px;font-size:19px}
.pc .ask{gap:18px;margin-top:6px}
.pc .avatar{width:96px;height:96px;font-size:54px;border-width:4px}
.pc .bubble{border-radius:26px;padding:16px 24px 18px}
.pc .bubble::before{left:-12px;margin-top:-12px;border-width:12px}
.pc .bubble h1{font-size:34px}
.pc .bubble small{font-size:17px}
.pc .fieldblk{gap:10px}
.pc .fieldblk.grow{flex:none;height:330px}
.pc .flabel{font-size:17px}
.pc .frow input{height:72px;font-size:26px;padding:0 22px;border-radius:20px}
.pc .frow textarea{height:150px;font-size:22px;line-height:1.6;padding:16px 20px;border-radius:20px}
.pc .fieldblk.grow .frow textarea,.pc .fieldblk.side .frow textarea{height:auto}
.pc .warn{font-size:15.5px}
.pc .idea-l{font-size:15px}
.pc .ideas{gap:10px}
.pc .idea{font-size:19px;padding:13px 22px}
.pc .fieldblk.side{flex:none;height:300px;column-gap:20px}
.pc .fieldblk.side .idea{font-size:17px;padding:12px 16px;border-radius:16px}
.pc .cols2{flex:none;gap:20px}
.pc .gcard{flex:none;height:230px;gap:16px}
.pc .gcard > div{border-radius:24px;padding:18px 22px;gap:6px}
.pc .gcard small{font-size:16px}
.pc .gcard b{font-size:27px}
.pc .gcard .main b{font-size:36px}
.pc .gcard .nick{font-size:16px}
.pc .gcard .nick b{font-size:20px}
.pc .showcase{flex:none;height:260px;border-radius:30px;padding:24px 34px;gap:28px}
.pc .showcase .big{font-size:140px}
.pc .showcase p{font-size:21px}
.pc .showcase .chipl{font-size:16px}
.pc .emo{flex:none;height:320px;gap:10px}
.pc .em{font-size:44px;border-radius:18px}
.pc .drawrow{gap:16px}
.pc .dcard{min-height:150px;border-radius:24px;gap:8px}
.pc .dcard small{font-size:15px}
.pc .dcard b{font-size:30px}
.pc .drawbtn{font-size:20px;border-radius:22px;padding:12px 26px}
.pc .twrow{flex:none;height:300px;grid-template-columns:300px minmax(0,1fr);gap:20px}
.pc .dcard.tw b{font-size:20px}
.pc .sws{flex:none;height:300px;gap:12px}
.pc .swb{font-size:18px;border-radius:20px}
.pc .swb i{width:60px;height:60px}
.pc .cols3{flex:none;height:300px;gap:16px}
.pc .ncard{border-radius:24px;padding:16px 18px;gap:8px}
.pc .ncard header{font-size:21px}
.pc .ncard header i{font-size:22px}
.pc .hearts button{width:50px;height:58px;font-size:44px}
.pc .val{font-size:26px}
.pc .optg{gap:10px}
.pc .optg button{height:58px;font-size:21px;border-radius:16px}
.pc .oneline{font-size:22px;padding:10px 20px;border-radius:18px}
.pc .reveal{font-size:17px;padding:10px 16px;border-radius:16px}
.pc .matrow{gap:8px}
.pc .matchip{padding:6px 14px 7px;border-radius:14px}
.pc .matchip small{font-size:13.5px}
.pc .matchip b{font-size:19px}
.pc .strow{font-size:16px}
.pc .pips i{width:16px;height:16px;border-radius:5px}
.pc .app.weave .an{display:grid;grid-template-columns:270px minmax(0,1fr);grid-template-rows:410px;align-content:center;column-gap:22px}
.pc .app.weave .an > .fieldblk{grid-column:1 / 3;height:auto}
.pc .paper{grid-column:2;border-radius:24px;padding:16px 20px 18px;gap:12px;box-shadow:0 5px 0 var(--line)}
.pc .paper header b{font-size:18px;padding:3px 14px}
.pc .paper header em{font-size:15px}
.pc .paper p{font-size:21px;line-height:1.7}
.pc .paper p.s1{font-size:18.5px;line-height:1.65}
.pc .paper p.s2,.pc .paper p.s3{font-size:16.5px;line-height:1.6}
.pc .editb{font-size:17px;padding:10px 18px}
.pc .pager{grid-column:1;grid-row:1;flex-direction:column;align-items:stretch;gap:5px}
.pc .pager button,.pc .pager button.c{justify-content:flex-start;height:40px;border-radius:13px;font-size:17px;gap:10px;padding:0 12px}
.pc .pager button span{display:inline}
.pc .pager button em{display:inline;margin-left:auto;font-style:normal;font-family:var(--body);font-size:13px;color:var(--teal)}
.pc .pager .tip{display:none}
.pc .grow2{gap:14px}
.pc .gbox{border-radius:18px;padding:9px 16px 10px}
.pc .gbox small{font-size:14.5px}
.pc .gbox b{font-size:20px}
.pc .gbox.now b{font-size:34px}
.pc .garr{font-size:24px}
.pc .pv{flex:none;height:300px;padding:16px 20px;border-radius:22px}
.pc .pv p{font-size:18px;line-height:1.65;margin-bottom:8px}
.pc .ptag{font-size:15px;padding:1px 9px}
.pc .todo3{font-size:16.5px;gap:4px 10px}
.pc .todo3 b{width:24px;height:24px;font-size:14px}
.pc .app.check{grid-template-columns:244px minmax(0,1fr)}
.pc .app.check .an{display:grid;grid-template-columns:336px minmax(0,1fr);grid-template-rows:440px;align-content:center;column-gap:22px}
.pc .steps9{flex-direction:column;gap:5px}
.pc .steps9 button,.pc .steps9 button.c{width:auto;height:auto;min-height:40px;border-radius:13px;display:flex;align-items:center;justify-content:flex-start;gap:10px;padding:5px 12px;font-family:var(--body);font-size:14.5px;line-height:1.3;text-align:left;box-shadow:none}
.pc .steps9 button::before{content:attr(data-n);flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-family:var(--disp);font-size:14px;background:var(--sky2)}
.pc .steps9 button .n{display:none}
.pc .steps9 button span{display:inline}
.pc .steps9 button.o,.pc .steps9 button.x{background:#fff;border-color:var(--line2);color:var(--soft)}
.pc .steps9 button.o::before{background:var(--teal-soft);color:var(--teal)}
.pc .steps9 button.x::before{background:var(--pop-soft);color:var(--pop)}
.pc .steps9 button.c{background:var(--cta-soft);border-color:var(--cta-d);color:var(--ink)}
.pc .steps9 button.c::before{background:var(--cta);color:var(--navy)}
.pc .qbig{border-radius:28px;padding:20px 36px;box-shadow:0 5px 0 var(--line);gap:10px}
.pc .qbig small{font-size:18px}
.pc .qbig b{font-size:38px}
.pc .act.ox{gap:12px;padding-right:0}
.pc .obtn,.pc .xbtn{width:auto;height:auto;border-radius:20px;flex-direction:row;gap:10px;padding:12px 26px;font-size:21px}
.pc .obtn i,.pc .xbtn i{font-size:30px}
.pc .obtn .gs,.pc .xbtn .gs{display:none}
.pc .obtn .gl,.pc .xbtn .gl{display:inline;font-size:21px}
.pc .fixed{font-size:24px}
.pc .rbox{flex:none;height:260px;font-size:22px;line-height:1.7;padding:18px 22px;border-radius:22px}
.pc .donegrid{flex:none;height:380px;gap:20px}
.pc .did{gap:8px}
.pc .did li{font-size:17px;padding:9px 16px 9px 44px;border-radius:16px}
.pc .did li::before{left:15px;top:9px}
.pc .cando{border-radius:24px;padding:20px 24px;gap:8px}
.pc .cando h2{font-size:21px}
.pc .cando ol{font-size:17px;line-height:1.6}
.pc .endbtns{order:0;flex-direction:row}
.pc .stubwrap{flex:none;gap:28px}
.pc .stub{width:380px}
.pc .stub .mc{font-size:34px}
.pc .sianbox{font-size:18px}
/* PC 시작 */
.pc .app.start .hd{display:none}
.pstartg{display:grid;grid-template-columns:1fr 1.06fr;gap:28px;align-items:center}
.pc .eyebrow2{font-size:18px}
.gbadge{display:inline-block;font-family:var(--disp);font-size:16px;color:var(--navy);background:var(--cta);border-radius:999px;padding:2px 12px;margin-right:8px}
.pc .title{margin:6px 0 10px;font-size:84px;line-height:1.02;white-space:nowrap}
.pc .lede{font-size:19px;margin:0 0 18px;line-height:1.55}
.pc .road{gap:6px}
.pc .road div{border-radius:18px;padding:12px 4px 13px}
.pc .road i{font-size:34px}
.pc .road b{font-size:19px}
.pc .road small{font-size:13.5px}
.pc .road em{font-size:22px}
.sian-note{margin:14px 0 0;font-size:13.5px;line-height:1.5;color:var(--mute)}
.pcard{background:#fff;border:2px solid var(--line);border-radius:24px;box-shadow:0 5px 0 var(--line);padding:18px 20px;min-width:0}
.pcard h2{margin:0 0 4px;font-family:var(--disp);font-weight:400;font-size:20px;color:var(--blue)}
.pcard ol{margin:0 0 14px;padding-left:1.2em;font-size:17px;line-height:1.55}
.pcard h2.pp{color:var(--pop)}
.pcard .pl{font-size:16px;padding:11px 14px;border-radius:16px;align-items:flex-start;gap:11px}
.pcard .pl i{width:28px;height:28px;font-size:16px}
/* PC 놀이 */
.pc .app.game .rail{display:flex}
.pc .gscreen,.pc .g-run .gscreen{height:auto;max-width:1040px;margin:auto;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto auto auto auto auto auto auto;grid-template-areas:"arena top" "arena ttl" "arena hud" "arena msg" "arena leg" "arena pad" "arena hint" "arena skip";column-gap:34px;row-gap:14px;padding:30px 56px;align-content:center}
.pc .app.game .ct{justify-content:center}
.pc .app.game .an{flex:none;max-width:none}
.pc .bk.lt{display:none}
.pc .gtag{font-size:17px;padding:5px 16px}
.pc .gscreen h1{font-size:44px;line-height:1.15}
.pc .hud{gap:12px}
.pc .scorebox{font-size:28px;padding:4px 18px;border-radius:16px}
.pc .timebar{height:20px}
.pc .gmsg{font-size:21px}
.pc .glegend{font-size:17px}
.pc .gscreen .skip{font-size:16px}
.pc .gscreen .arena.maze,.pc .gscreen .arena.whack{width:min(calc(var(--lh,720px) - 140px),560px)}
.pc .gscreen .arena.dodge{height:min(calc(var(--lh,720px) - 140px),580px);max-width:none}
.pc .gscreen .arena.run{width:min(560px,calc(var(--lw,1280px) - 720px))}
.pc .arena{border-radius:28px}
.pc .arena.maze{padding:10px}
.pc .mgrid span{font-size:44px}
.pc .mgrid .w{border-radius:12px;margin:2.5px}
.pc .obj{font-size:44px}
.pc .player .pe{font-size:58px}
.pc .rhero .pe{font-size:50px}
.pc .robj{font-size:40px}
.pc .player .pn,.pc .rhero .pn{font-size:15px}
.pc .pop{font-size:70px}
.pc .count{font-size:110px}
.pc .gscreen .pad{justify-self:start;align-self:start}
.pc .padbtn{width:64px;height:58px;border-radius:12px;background:#fff;border:2px solid var(--line);border-bottom-width:5px;box-shadow:none;font-size:20px}
.pc .padbtn:active{box-shadow:none;border-bottom-width:2px}
.pc .dpad{grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,58px);gap:6px;grid-template-areas:". up ." "left down right"}
.pc .dpad .padbtn{width:64px;height:58px;font-size:20px}
.pc .padbtn.jump{width:200px;height:64px;font-size:22px}
.pc .pchint{display:block;grid-area:hint;margin:0;font-size:16px;color:var(--soft)}
.pc .app.lab .gscreen{grid-template-rows:auto auto auto auto auto auto;grid-template-areas:"arena top" "arena ttl" "arena seg" "arena pad" "arena hint" "arena go"}
.pc .app.lab .gscreen h1{font-size:28px;line-height:1.3}
.pc .seg{flex-direction:row}
.pc .seg button{flex:1;height:56px;font-size:20px;border-radius:16px}
.pc .gconfirm{height:64px;font-size:22px;border-radius:18px;box-shadow:0 5px 0 var(--cta-d);justify-self:start;padding:0 34px}
/* PC 열리는 창 */
.pc .sheetwrap{align-items:center;justify-content:center}
.pc .sheet2{flex:none;width:min(980px,calc(100% - 80px));max-height:calc(100% - 80px);margin:0;border-radius:26px;padding:20px 26px 24px;gap:14px}
.pc .sheet2 > header b{font-size:26px}
.pc .sheet2 > header span{font-size:16px}
.pc .sheet2 .x{width:46px;height:46px;font-size:19px}
.pc .sbody{font-size:17px;gap:12px}
.pc .fcols{flex:none;gap:14px}
.pc .fcol{border-radius:20px;padding:14px 16px;gap:6px}
.pc .fcol h3{font-size:22px}
.pc .fcol h3 i{font-size:22px}
.pc .fcol h3 small{font-size:14px}
.pc .fcol li button{font-size:17px}
.pc .fcol li em{font-size:14.5px}
.pc .jumpgrid{gap:8px}
.pc .jumpgrid button{font-size:15.5px;padding:10px 12px}
.pc .tbody h3{font-size:20px}
.pc .stds small{font-size:14.5px}
.pc .toast{font-size:19px;padding:13px 22px;bottom:24px}
.pc .devbar{top:8px;right:10px}
.pc .devbar button{font-size:13px;padding:4px 10px}

/* 3-4 1판 고침(11-12): 둘 중 하나도 고르면 노란색, 놀이 화면 아래 '이전' */
.vcard.on{background:var(--cta-soft)!important;border-color:var(--cta-d)!important;box-shadow:0 4px 0 var(--cta-d)}
.gscreen .gfoot{grid-area:skip;display:flex;align-items:center;gap:12px;justify-self:start}
.gscreen .gfoot .skip{grid-area:auto}
.pc .gscreen .gfoot{grid-area:skip}
.gfoot .prev{display:inline-flex;align-items:center;font-family:var(--disp);font-size:14px;line-height:1.2;padding:7px 14px;border-radius:12px;background:#fff;border:2px solid var(--line);color:var(--navy);white-space:nowrap}
.pc .gfoot .prev{font-size:18px;padding:12px 22px;border-radius:16px}
.pv.pvall{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.pv.pvall::after{display:none}

/* ===== 3-4 1판 고침 둘째(11-12 휴먼쌤) ===== */
/* 폰: '다음' 위에 동그란 '이전', 화살표 없음, 건너뛰기는 작은 단추 */
.act .prev{display:grid;order:0;place-items:center;flex:none;width:52px;height:52px;border-radius:50%;background:#fff;border:2px solid var(--line);box-shadow:0 3px 0 var(--line);font-family:var(--disp);font-size:15px;line-height:1;color:var(--navy);padding:0}
.act .prev .ar{display:none}
.act .prev:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
html:not(.pc) .go i{display:none}
.act .sub{font-family:var(--disp);font-size:13px;line-height:1.2;color:var(--navy);background:#fff;border:2px solid var(--line);border-radius:12px;padding:6px 8px;text-decoration:none}
.go.fin{order:2}
.gscreen .gfoot .skip{border:2px solid var(--line);background:#fff;border-radius:12px;padding:6px 12px;font-family:var(--disp);font-size:13px;line-height:1.2;color:var(--navy);text-decoration:none}
.pc .act .prev{width:auto;height:auto;border-radius:16px;box-shadow:none;display:inline-flex}
.pc .act .prev .ar{display:inline}
.pc .gscreen .gfoot .skip{font-size:17px;padding:10px 18px;border-radius:16px}
/* 폰: 왼쪽 띠에서 지금 걸음을 또렷하게 */
html:not(.pc) .ph > li.c{background:rgba(255,204,51,.2);border-radius:12px;padding:5px 0 4px;margin:0 4px}
html:not(.pc) .ph > li.c .phb i{background:var(--cta);box-shadow:0 0 0 3px var(--navy),0 0 0 5px #fff}
html:not(.pc) .ph > li.c .phb b{margin-top:5px;color:var(--navy);background:var(--cta);border-radius:6px;padding:0 4px}
/* 놀이 카드 한 장 */
.gcard1{align-self:center;width:min(100%,500px);display:flex;align-items:center;gap:18px;background:var(--navy);color:#fff;border-radius:22px;box-shadow:0 5px 0 #111a2e;padding:16px 22px}
.gcard1 .gic{flex:none;width:76px;height:76px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:44px;line-height:1}
.gcard1 small{display:block;font-family:var(--disp);font-size:14px;color:var(--cta);margin-bottom:4px}
.gcard1 p{margin:3px 0;font-size:15px;color:#c9d6ee}
.gcard1 p b{font-size:21px;color:#fff;margin-left:8px}
.pc .gcard1{width:760px;padding:30px 40px;gap:30px;border-radius:30px}
.pc .gcard1 .gic{width:120px;height:120px;font-size:70px}
.pc .gcard1 small{font-size:19px;margin-bottom:8px}
.pc .gcard1 p{font-size:20px;margin:6px 0}
.pc .gcard1 p b{font-size:32px;margin-left:12px}
/* 엔딩 */
.endg{position:relative;flex:1;min-height:0;display:grid;grid-template-columns:150px minmax(0,1fr);gap:18px;align-items:center;border-radius:22px;background:#fff;box-shadow:0 5px 0 var(--line);padding:12px 20px;overflow:hidden}
.endg::before{content:'';position:absolute;top:0;right:0;bottom:0;left:0;pointer-events:none;opacity:.3;background-image:radial-gradient(circle,#ffcc33 3px,transparent 4px),radial-gradient(circle,#3f5efb 2.5px,transparent 3.5px),radial-gradient(circle,#0e9e90 3px,transparent 4px),radial-gradient(circle,#d9481f 2.5px,transparent 3.5px);background-size:90px 70px,110px 80px,70px 95px,130px 60px;background-position:10px 8px,40px 30px,65px 50px,20px 45px;animation:confet 9s linear infinite}
@keyframes confet{from{background-position:10px 8px,40px 30px,65px 50px,20px 45px}to{background-position:10px 148px,40px 190px,65px 240px,20px 165px}}
.trophy{position:relative;justify-self:center;width:136px;height:136px;border-radius:50%;background:radial-gradient(circle at 50% 38%,#fff8d9,#ffcc33);display:grid;place-items:center;box-shadow:0 6px 0 var(--cta-d);animation:trophyPop .6s ease-out}
.trophy b{font-size:70px;line-height:1}
.trophy .hero{position:absolute;right:-4px;bottom:-2px;width:50px;height:50px;border-radius:50%;background:#fff;border:3px solid var(--cta-d);display:grid;place-items:center;font-size:28px;line-height:1}
@keyframes trophyPop{0%{transform:scale(.75)}70%{transform:scale(1.06)}100%{transform:scale(1)}}
.endt{position:relative;display:flex;flex-direction:column;gap:6px;min-width:0}
.endt small{font-family:var(--disp);font-size:15px;color:var(--pop)}
.endt h1{margin:0;font-family:var(--disp);font-weight:400;font-size:24px;line-height:1.25;outline:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{font-family:var(--disp);font-size:12.5px;background:var(--sky2);color:var(--blue);border-radius:999px;padding:2px 10px}
.nexts{list-style:none;margin:2px 0 0;padding:0;display:flex;flex-direction:column;gap:4px}
.nexts li{display:flex;align-items:center;gap:8px;font-size:14px}
.nexts b{flex:none;width:22px;height:22px;border-radius:50%;background:var(--navy);color:var(--cta);display:grid;place-items:center;font-size:13px;line-height:1}
.pc .endg{flex:none;height:440px;grid-template-columns:260px minmax(0,1fr);padding:30px 48px;gap:44px;border-radius:30px}
.pc .trophy{width:230px;height:230px}
.pc .trophy b{font-size:118px}
.pc .trophy .hero{width:80px;height:80px;font-size:46px}
.pc .endt{gap:12px}
.pc .endt small{font-size:21px}
.pc .endt h1{font-size:40px}
.pc .chips{gap:10px}
.pc .chips span{font-size:17px;padding:5px 16px}
.pc .nexts{gap:8px}
.pc .nexts li{font-size:20px;gap:12px}
.pc .nexts b{width:32px;height:32px;font-size:17px}
html:not(.pc) .an.cust .tile small{display:none}
html:not(.pc) .an.cust .tile .pic{width:42px;height:42px;font-size:25px}
.pc .act.two .go{flex:0 0 250px;justify-content:center}
.pc .act.two .go.fin{order:2}
.pc .act.two .keys{display:block;margin-left:auto}

/* ===== 3-4 1판 고침 셋째(11-12 휴먼쌤) ===== */
/* 장소 · 특별 규칙 카드: 카드 이름표를 크게, 장소 글 칸은 세로 가운데 */
.dcard.tw small{font-size:15px;padding:2px 14px}
.twrow.plrow > .fieldblk{align-self:center}
.twrow.plrow .dcard.tw b{font-size:20px}
.pc .dcard.tw small{font-size:21px;padding:4px 18px}
.pc .twrow.plrow .dcard.tw b{font-size:30px}
/* 엔딩: 내 게임 요약 */
.endt small{font-size:14px}
.endt h1{font-size:25px}
.sumg{margin:2px 0 0;display:flex;flex-direction:column;gap:4px;min-width:0}
.sumg > div{display:flex;align-items:center;gap:8px;min-width:0}
.sumg dt{flex:none;width:62px;text-align:center;font-family:var(--disp);font-size:12px;line-height:1.5;color:var(--blue);background:#e7f0ff;border-radius:999px}
.sumg dd{margin:0;min-width:0;font-size:14px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc .endt small{font-size:20px}
.pc .endt h1{font-size:40px}
.pc .sumg{gap:10px;margin-top:6px}
.pc .sumg > div{gap:14px}
.pc .sumg dt{width:96px;font-size:17px;line-height:1.7}
.pc .sumg dd{font-size:21px}

/* ===== 3-4 1판 고침 넷째 · 폰 기준(11-12 휴먼쌤 "지금부턴 모바일 기준") ===== */
/* 첫 화면 */
html:not(.pc) .app.start{grid-template-columns:minmax(0,1fr)}
html:not(.pc) .app.start .act{display:none}
html:not(.pc) .app.start .ct{padding:12px 24px 12px 28px}
.guideb{position:absolute;top:10px;right:14px;z-index:5;font-family:var(--disp);font-size:13.5px;line-height:1.2;color:var(--navy);background:#fff;border:2px solid var(--line);box-shadow:0 3px 0 var(--line);border-radius:999px;padding:7px 14px;white-space:nowrap}
.guideb:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.roadrow{display:flex;align-items:stretch;gap:8px}
.roadrow .road{flex:1;min-width:0}
.startb{flex:none;width:104px;border:0;border-radius:18px;background:var(--cta);box-shadow:0 5px 0 var(--cta-d);font-family:var(--disp);font-size:26px;line-height:1.1;color:var(--navy);padding:0 6px}
.startb:active{transform:translateY(3px);box-shadow:0 2px 0 var(--cta-d)}
.resumeb{display:block;width:100%;margin-top:12px;font-family:var(--disp);font-size:16px;line-height:1.2;white-space:nowrap;color:var(--navy);background:#fff;border:2px solid var(--line);box-shadow:0 3px 0 var(--line);border-radius:14px;padding:9px 12px}
/* 아이콘과 글이 겹치지 않게: 그림은 정해진 칸 안에, 글은 그 아래 충분히 띄워 */
.road div{gap:4px;padding:8px 4px 9px}
.road i{display:block;height:34px;line-height:34px;font-size:25px;overflow:visible}
.tile{gap:7px}
.tile .pic{font-size:27px;line-height:1;margin-bottom:2px}
.tiles.r2 .tile .pic{font-size:18px}
.vcard{gap:10px}
.vcard i{font-size:50px;line-height:1.25}
html:not(.pc) .phb{gap:4px}
html:not(.pc) .phb i{font-size:15px;line-height:1}
.swb{gap:6px}
/* 오늘 우리가 해볼 것: 가로로 긴 줄 세 개를 위아래로 */
html:not(.pc) .goalcards{grid-template-columns:minmax(0,1fr);grid-auto-rows:minmax(0,1fr);gap:8px}
html:not(.pc) .goalc{flex-direction:row;justify-content:flex-start;text-align:left;gap:14px;padding:6px 18px;font-size:16px;line-height:1.4}
html:not(.pc) .goalc b{width:34px;height:34px;font-size:18px}
/* 빠르기 실험(폰): 빠르기 단추는 옆으로 나란히, '이 빠르기로 할래요'가 잘리지 않게 */
html:not(.pc) .app.lab .gscreen{row-gap:7px;padding-bottom:16px}
html:not(.pc) .app.lab .gscreen h1{font-size:15.5px;line-height:1.3}
html:not(.pc) .app.lab .seg{flex-direction:row;gap:5px}
html:not(.pc) .app.lab .seg button{flex:1;height:36px;font-size:14px;padding:0 2px;border-radius:10px}
html:not(.pc) .gconfirm{height:42px;font-size:15px}
/* 맛보기 놀이 아래 단추 한 줄 */
.gscreen .gfoot .skip{white-space:nowrap}

/* ===== 기기마다 다르게 보이지 않게(11-12 휴먼쌤 "기술적으로 보완해줘") ===== */
/* 그림 글자: 글자 1.2배 네모 칸의 Fluent 3D 그림. 어느 기기에서나 같은 크기라 아래 글과 겹치지 않는다 */
img.ej{display:inline-block;width:1.2em;height:1.2em;vertical-align:-.22em;object-fit:contain;pointer-events:none;-webkit-user-drag:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.road i,.vcard i,.tile .pic,.gcard1 .gic,.trophy b,.trophy .hero,.phb i,.em,.pop,.goalc b{display:flex;align-items:center;justify-content:center}
.road i img.ej,.vcard i img.ej,.tile .pic img.ej,.phb i img.ej,.em img.ej{vertical-align:0}
/* 화살표 · 하트 그림 */
svg.ico{display:block;width:1em;height:1em}
.padbtn svg.ico{width:1.05em;height:1.05em}
.hearts button svg.ico{width:.9em;height:.9em}
/* 안전 영역 읽기(보이지 않음) */
#safe{position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
/* 화면 비율이 범위를 넘어 둘레가 빌 때: 무대를 카드처럼 */
.stage.boxed .app{border-radius:18px;box-shadow:0 10px 36px rgba(31,42,68,.18)}
.tile .pic img.ej{width:1.35em;height:1.35em}
/* PC: 그림 카드가 두 줄일 때도 무대 높이 안에(게임 고르기 여덟 장) */
.pc .tiles.pics .tile{min-height:min(270px,calc((var(--lh,720px) - 230px) / 2))}

/* ===== 못 한 것과 한계 다시 풀기(11-13 휴먼쌤 "못한것과 한계를 … 다시 재 해결해봐") ===== */
/* 옛 브라우저(사파리 14 · 크롬 87 아래): inset은 top/right/bottom/left로 풀어 썼고, aspect-ratio가 없으면 놀이판 크기를 직접 준다 */
@supports not (aspect-ratio:1/1){
  .gscreen .arena.maze,.gscreen .arena.whack{height:min(calc(var(--lh,320px) - 22px),calc(var(--lw,760px) - 456px))}
  .gscreen .arena.dodge{width:min(calc((var(--lh,320px) - 22px)*.9),calc(var(--lw,760px) - 456px))}
  .gscreen .arena.run{height:calc(min(calc((var(--lh,320px) - 22px)*1.6),calc(var(--lw,760px) - 392px))/1.6)}
  .pc .gscreen .arena.maze,.pc .gscreen .arena.whack{height:min(calc(var(--lh,720px) - 140px),560px)}
  .pc .gscreen .arena.dodge{width:calc(min(calc(var(--lh,720px) - 140px),580px)*.9)}
  .pc .gscreen .arena.run{height:calc(min(560px,calc(var(--lw,1280px) - 720px))/1.6)}
  .stub .mc{height:66px}
}
/* 아주 옛 브라우저(스크립트가 돌지 못한 때)에만 보이는 안내 */
.oldmsg{position:fixed;left:0;top:0;right:0;bottom:0;z-index:300;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;background:#e9f4ff;color:#1d2433;font-family:var(--body)}
.oldmsg b{font-size:22px;line-height:1.35}
.oldmsg span{margin-top:10px;font-size:15px;line-height:1.5;color:#4a5568}
.oldmsg small{margin-top:14px;font-size:11px;color:#8a96ac;word-break:break-all}
/* 그림 저장 창(앱 안 브라우저 · 공유 창이 안 열릴 때): 그림을 크게 띄워 길게 눌러 저장하거나 화면을 캡처하게 한다 */
.cardview{position:absolute;left:0;top:0;right:0;bottom:0;z-index:80;display:flex;flex-direction:column;padding:10px 14px;background:#1f2a44}
.cvpic{position:relative;flex:1;min-height:0}
.cvimg{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:contain;-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto}
.cvbar{flex:none;display:flex;align-items:center;margin-top:8px;color:#fff}
.cvbar p{flex:1;min-width:0;margin:0;font-size:13.5px;line-height:1.35}
.cvbar p b{display:block;font-size:16px;line-height:1.3}
.cvbar button{flex:none;margin-left:10px;border:0;border-radius:14px;font-family:var(--disp);font-size:15.5px;line-height:1.2;padding:10px 18px;white-space:nowrap}
.cvshare{background:var(--cta);box-shadow:0 3px 0 var(--cta-d);color:var(--navy)}
.cvclose{background:#fff;color:var(--navy)}
.pc .cardview{padding:28px 44px}
.pc .cvbar{margin-top:16px}
.pc .cvbar p{font-size:18px}
.pc .cvbar p b{font-size:22px}
.pc .cvbar button{margin-left:14px;font-size:19px;padding:13px 26px;border-radius:16px}
