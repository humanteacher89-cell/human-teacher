<script>
'use strict';
/* 게임 메이커 새 판 시안 — 함께 쓰는 작은 도구 (조사 붙이기는 시험판에서 가져옴) */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));

function jong(word){
  const m = String(word).match(/[가-힣0-9A-Za-z](?=[^가-힣0-9A-Za-z]*$)/);
  if (!m) return 0;
  const ch = m[0], code = ch.charCodeAt(0);
  if (code >= 0xAC00) return (code - 0xAC00) % 28;
  if (/[0-9]/.test(ch)) return '178'.includes(ch) ? 8 : ('036'.includes(ch) ? 1 : 0);
  return /[lL]/.test(ch) ? 8 : (/[mnMN]/.test(ch) ? 1 : 0);
}
function josa(word, pair){
  const jg = jong(word), [a, b] = pair.split('/');
  if (pair === '으로/로') return (jg === 0 || jg === 8) ? '로' : '으로';
  return jg ? a : b;
}
const j = (word, pair) => word + josa(word, pair);

function clean(v, max){ return String(v || '').replace(/['"‘’“”\r\n]/g, '').replace(/\s+/g, ' ').trim().slice(0, max); }
/* 아이가 길게 지어 쓰는 글(게임 방법 · 다시 부탁하는 말)은 따옴표를 살린다 */
function tidy(v, max){ return String(v || '').replace(/[\r\n]+/g, ' ').replace(/\s+/g, ' ').trim().slice(0, max); }
/* 문장 끝 마침표를 하나로 맞춘다 */
function fin(t){ t = String(t || '').trim().replace(/[.。]+$/, ''); return t ? (/[!?]$/.test(t) ? t : t + '.') : ''; }
function checkText(v){
  if (v.replace(/[^0-9]/g, '').length >= 7) return { block:true, msg:'전화번호 같은 개인정보는 쓰지 않아요. 지우고 다시 써 볼까요?' };
  const f = FAMOUS.find(n => v.replace(/\s/g, '').includes(n));
  if (f) return { block:false, msg:`‘${f}’${josa(f, '은/는')} 유명한 캐릭터예요. 내가 만든 캐릭터로 바꿔 보면 어때요?` };
  return null;
}
function getP(obj, path){ return path.split('.').reduce((o, k) => (o == null ? o : o[k]), obj); }
function setP(obj, path, v){
  const ks = path.split('.'), last = ks.pop();
  let o = obj;
  for (const k of ks){ if (o[k] == null) o[k] = {}; o = o[k]; }
  o[last] = v;
}
const pickOne = arr => arr[Math.floor(Math.random() * arr.length)];
const colorHex = name => { const c = COLORS.find(x => x[0] === name); return c ? c[1] : ''; };

/* ---------- 기기마다 다르게 보이지 않게 (11-12 휴먼쌤 "모바일 기기, 태블릿 기종마다 전부다 다르게 디스플레이되는건 아닌가? 이부분 기술적으로 보완해줘") ----------
   1) 그림 글자(이모지): 기기마다 이모지 글꼴(애플 · 삼성 · 구글 · 마이크로소프트)이 달라 모양 · 크기 · 위아래 높이가 다르다(폰에서 아이콘과 글이 겹친 까닭).
      화면에 나오는 글 속 이모지를 Microsoft Fluent 3D 그림(webp)으로 바꿔 글자 1.2배 네모 칸에 넣는다. 어느 기기에서나 같은 그림 · 같은 크기.
      그림(MIT 허가, @lobehub/fluent-emoji-3d 1.1.0으로 판 고정)을 받지 못하면 그 자리는 원래 글자로 둔다.
   2) ▶ ◀ ♥ 같은 기호는 아이폰이 이모지로 그리기도 한다 → 화살표 · 하트는 그림(SVG)으로 그린다.
   받는 차례(11-13 휴먼쌤 "못한것과 한계를 … 다시 재 해결해봐"): 우리 주소(emo/ — 이 화면과 같은 주소에 함께 둔 그림) → jsDelivr → 원래 글자.
   학교망이 jsDelivr를 막아도 우리 주소의 그림이 나오고, HTML 한 파일만 따로 열면(옆에 emo 폴더가 없으면) jsDelivr로 넘어간다.
   주소마다 아는 그림 두 장으로 먼저 되는지 알아본다(막힌 주소에 그림마다 헛걸음하지 않게).
   주소의 상태는 셋이다: 됨(ok) · 막힘(off: 받기에 바로 실패) · 늦음(late: 정한 시간 안에 대답이 없음).
   막힌 망은 끊지 않고 붙잡아 두기도 하고, 느린 망은 그냥 늦게 준다. 둘을 가를 수 없으니 '늦음'일 때는 일단 다음 주소(없으면 글자)로 보이고,
   그 주소의 대답은 계속 기다렸다가 오면 다시 그 주소를 쓴다(글자로 돌려 둔 것도 그림으로 되돌린다 — emoRevive). 느린 망을 막힌 망으로 굳히지 않는다. */
const EMO_OWN = true;     // build.py가 넣는다: 우리 주소에 둘 그림 폴더(emo/)가 있을 때 true
const OWN_ASSETS = EMO_OWN && true;   // 그림과 글꼴(fonts/)을 모두 우리 주소에 두었을 때(보호자용 가이드의 허가 표시 글이 바뀐다)
const EMO_ALL = ["1f430","1f996","1f916","1f431","1f422","1f427","2604-fe0f","1f9e9","1f998","1f64b","1f9d1-200d-1f91d-200d-1f9d1","1f9f8","1f60e","1f4d6","26a1","1f3c6","1f3c1","1f525","1f648","1f4aa","1f61c","1f917","1f9d0","1f319","2600-fe0f","1f307","2744-fe0f","1f308","1f32b-fe0f","1f514","1f3bc","1f32c-fe0f","1f4a7","1f941","1f493","1f606","1f3c5","1f60c","1f632","1f389","1f30c","1f420","1f36d","1f333","1f47e","1f58d-fe0f","1f3b5","1f507","1f4bb","1f4f1","1f500","2795","1f5fa-fe0f","1f195","1f4a8","1f3a4","1f45f","1f3a9","1f36c","1f642","2b50","1f3af","1f0cf","2753","270f-fe0f","1f436","1f43b","1f98a","1f43c","1f438","1f419","1f984","1f47b","1f47d","1f9da","1f359","1f335","2601-fe0f","1f344","1f680","1f41d","1f989","1f329-fe0f","1f6aa","1faa8","1f3ae","1f4ad","1f9f5","1f914","2764-fe0f","23f1-fe0f","1f30d","1f522","1f3a8","1f4dd","2728","1f64a","1f527"];
/* 이름 · 주소 · 되는지 알아볼 때 기다리는 시간 · 주소 끝에 붙일 것.
   우리 주소의 그림은 오래 캐시하게 올린다(_headers: 다시 열 때 망을 타지 않는다). 그림 묶음의 판을 바꾸면 ?v= 도 바꿔야 옛 그림이 남지 않는다 */
const EMO_ST = [['우리 주소', 'emo/', 8000, '?v=1.1.0'], ['jsDelivr', 'https://cdn.jsdelivr.net/npm/@lobehub/fluent-emoji-3d@1.1.0/assets/', 4000, '']]
  .map(([name, base, patience, tail], i) => ({ name, base, patience, tail, ok:0, bad:0, off:(i === 0 && !EMO_OWN), late:false, probing:false, q:[] }));
const EMO_WAIT_OK = 12000;                    // 되는 주소에서 그림 한 장을 기다리는 시간
const EMO_LOST = new Set();                   // 어디서도 받지 못한 그림: 글자로 두고 다시 받지 않는다(늦던 주소가 살아나면 비운다)
const emoDown = st => st.off || st.late;      // 지금은 쓸 수 없는 주소
const EMO_SRC = '(?:[#*0-9]\\uFE0F?\\u20E3|\\p{Regional_Indicator}\\p{Regional_Indicator}|(?:\\p{Emoji_Presentation}|\\p{Extended_Pictographic}\\uFE0F)\\p{Emoji_Modifier}?(?:\\u200D(?:\\p{Emoji_Presentation}|\\p{Extended_Pictographic}\\uFE0F?)\\p{Emoji_Modifier}?)*)';
let EMO_RE = null, EMO_ONE = null, EMO_OFF = false, emoText = 0;
try { EMO_RE = new RegExp(EMO_SRC, 'gu'); EMO_ONE = new RegExp(EMO_SRC, 'u'); } catch (e) { EMO_OFF = true; }   // 아주 옛 브라우저는 글자 그대로
const emoName = e => [...e].map(c => c.codePointAt(0).toString(16).padStart(4, '0')).join('-');
const EMO_SKIP = 'textarea,script,style,title,[contenteditable],.noemo';
const emoRefit = () => { try { if (typeof fitSoon === 'function') fitSoon(); } catch (e) {} };   // 그림이 글자로 돌아가면(또는 되돌아오면) 크기가 달라진다: 화면을 다시 맞춘다(app.js)
/* 쓸 수 있는 주소가 하나도 없는 동안: 그림을 모두 글자로 돌린다 */
function emoAllText(){
  EMO_OFF = true;
  document.querySelectorAll('img.ej').forEach(x => { emoText++; x.replaceWith(document.createTextNode(x.alt)); });
  emoRefit();
}
/* 늦던 주소가 대답했다: 글자로 돌려 둔 것을 다시 그림으로 */
function emoRevive(){
  if (!EMO_RE || (!EMO_OFF && !EMO_LOST.size)) return;
  EMO_OFF = false; EMO_LOST.clear();
  emoWalk(document.body); emoRefit();
}
/* k번째 주소가 되는지 아는 그림 두 장으로 알아본다(주소마다 한 번). 알아보는 동안 온 그림은 줄을 세운다.
   하나라도 받으면 되는 주소, 둘 다 실패하면 막힌 주소(한 장만 빠진 것을 막힌 것으로 잘못 알지 않게), 정한 시간 안에 대답이 없으면 늦는 주소 */
function emoProbe(k, then){
  const st = EMO_ST[k];
  if (st.ok || emoDown(st)) return then();
  st.q.push(then);
  if (st.probing) return;
  st.probing = true;
  const names = [EMO_ALL[0] || '1f3ae', EMO_ALL[1] || '1f3c6'], ims = names.map(() => new Image());
  let end = false, fails = 0;
  const flush = () => st.q.splice(0).forEach(f => f());
  const fin = ok => {
    if (end) return;
    if (!ok && ++fails < ims.length) return;
    end = true; clearTimeout(t); ims.forEach(im => { im.onload = im.onerror = null; }); st.probing = false;
    const was = st.late; st.late = false;
    if (ok){ st.ok++; if (was) emoRevive(); }
    else { st.bad++; st.off = true; if (EMO_ST.every(emoDown)) emoAllText(); }
    flush();
  };
  const t = setTimeout(() => {          // 대답이 늦다: 기다리던 그림은 다음 주소로 보내고, 이 주소의 대답은 계속 기다린다
    if (end) return;
    st.late = true;
    if (EMO_ST.every(emoDown)) emoAllText();
    flush();
  }, st.patience);
  ims.forEach((im, i) => { im.onload = () => fin(im.naturalWidth > 0); im.onerror = () => fin(false); im.src = st.base + names[i] + '.webp' + st.tail; });
}
/* 주소들이 되는지 다 알아볼 때까지 기다린다(기기 진단용: 느린 망에서 '늦음'인 채로 재지 않게) */
function emoSettled(ms){
  return new Promise(res => {
    const t0 = Date.now();
    const tick = () => {
      for (let k = 0; k < EMO_ST.length; k++){          // 차례대로: 앞 주소가 막힌 것이 확실해야 다음 주소를 알아본다
        const st = EMO_ST[k];
        if (st.ok) return res();
        if (st.off) continue;
        if (!st.probing && !st.late) emoProbe(k, () => {});
        break;
      }
      if (EMO_ST.every(st => st.off) || Date.now() - t0 > ms) return res();
      setTimeout(tick, 150);
    };
    tick();
  });
}
/* 그림 하나를 k번째 주소부터 차례로 받는다. cb(받은 img 또는 null, 받은 주소 번호) */
function emoTry(im, name, k, cb){
  while (k < EMO_ST.length && emoDown(EMO_ST[k])) k++;
  if (k >= EMO_ST.length) return cb(null, -1);
  const st = EMO_ST[k];
  emoProbe(k, () => {
    if (emoDown(st)) return emoTry(im, name, k + 1, cb);
    let end = false;
    const fin = ok => {
      if (end) return; end = true; clearTimeout(t); im.onload = im.onerror = null;
      if (ok){ st.ok++; cb(im, k); } else { st.bad++; emoTry(im, name, k + 1, cb); }
    };
    const t = setTimeout(() => fin(false), EMO_WAIT_OK);
    im.onload = () => fin(im.naturalWidth > 0); im.onerror = () => fin(false);
    im.src = st.base + name + '.webp' + st.tail;
  });
}
function emoImg(e){
  const im = document.createElement('img'), name = emoName(e);
  im.className = 'ej'; im.alt = e; im.draggable = false;
  emoTry(im, name, 0, got => {
    if (got) return;
    EMO_LOST.add(name); emoText++;
    if (im.isConnected){ im.replaceWith(document.createTextNode(e)); emoRefit(); } else im.dataset.lost = '1';
  });
  return im;
}
/* 그림(canvas)에 그릴 그림 글자: 다른 주소의 그림은 CORS로 받아야 그림 저장이 막히지 않는다 */
function emoGet(e, cors){
  return new Promise(res => {
    if (!e || EMO_OFF || EMO_LOST.has(emoName(e))) return res(null);
    const im = new Image(); if (cors) im.crossOrigin = 'anonymous';
    let done = false; const end = v => { if (!done){ done = true; res(v); } };
    setTimeout(() => end(null), 6000);
    emoTry(im, emoName(e), 0, got => end(got));
  });
}
function emoSwap(t){
  const s = t.nodeValue, f = document.createDocumentFragment();
  let m, last = 0, n = 0;
  EMO_RE.lastIndex = 0;
  while ((m = EMO_RE.exec(s))){
    if (EMO_LOST.has(emoName(m[0]))) continue;          // 받지 못한 그림은 글자 그대로 둔다(다시 받느라 맴돌지 않게)
    if (m.index > last) f.appendChild(document.createTextNode(s.slice(last, m.index)));
    const im = emoImg(m[0]);
    f.appendChild(im.dataset.lost ? document.createTextNode(m[0]) : im); last = m.index + m[0].length; n++;
  }
  if (!n) return;
  if (last < s.length) f.appendChild(document.createTextNode(s.slice(last)));
  t.replaceWith(f);
}
function emoWalk(root){
  if (EMO_OFF || !root) return;
  if (root.nodeType === 3){ if (root.parentElement && EMO_ONE.test(root.nodeValue) && !root.parentElement.closest(EMO_SKIP)) emoSwap(root); return; }
  if (root.nodeType !== 1 || root.closest(EMO_SKIP)) return;
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT), list = [];
  while (w.nextNode()){ const n = w.currentNode; if (EMO_ONE.test(n.nodeValue) && !n.parentElement.closest(EMO_SKIP)) list.push(n); }
  list.forEach(emoSwap);
}
if (!EMO_OFF && window.MutationObserver){
  new MutationObserver(recs => {
    if (EMO_OFF) return;
    recs.forEach(r => {
      if (r.type === 'characterData') emoWalk(r.target);
      else r.addedNodes.forEach(n => { if (!(n.nodeType === 1 && n.tagName === 'IMG')) emoWalk(n); });
    });
  }).observe(document.body, { childList:true, subtree:true, characterData:true });
  emoWalk(document.body);
}
/* 쓰는 그림을 미리 받아 둔다(놀이 중에 그림이 늦게 뜨지 않게) */
function emoPreload(){
  if (EMO_OFF || !EMO_ALL.length) return;
  let i = 0;
  const tick = () => {
    if (EMO_OFF || i >= EMO_ALL.length) return;
    for (let k = 0; k < 8 && i < EMO_ALL.length; k++, i++) emoTry(new Image(), EMO_ALL[i], 0, () => {});
    setTimeout(tick, 150);
  };
  setTimeout(tick, 1500);
}

/* ---------- 기기 · 브라우저 알아보기 (그림 저장 길 고르기 · 기기 진단에 쓴다) ----------
   앱 안 브라우저(카카오톡 · 네이버 앱 들이 링크를 열 때 쓰는 작은 브라우저)는 내려받기가 막혀 있는 일이 많다.
   안드로이드는 UA의 '; wv)'(WebView), 아이폰 · 아이패드는 'Safari/'가 없는 것으로 알아보고, 이름을 아는 앱은 이름도 적는다. */
const ENV = (() => {
  const ua = navigator.userAgent || '', tp = navigator.maxTouchPoints || 0;
  const ios = /iP(hone|ad|od)/.test(ua) || (/Macintosh/.test(ua) && tp > 1);
  const android = /Android/.test(ua);
  const APPS = [[/KAKAOTALK/i, '카카오톡'], [/NAVER\(inapp/i, '네이버 앱'], [/DaumApps/i, '다음 앱'], [/BAND\//i, '밴드'], [/\bLine\//i, '라인'], [/Instagram/i, '인스타그램'],
    [/FBAN|FBAV|FB_IAB/i, '페이스북'], [/KAKAOSTORY/i, '카카오스토리'], [/everytimeApp/i, '에브리타임'], [/TikTok|BytedanceWebview|musical_ly/i, '틱톡'], [/\bGSA\//i, '구글 앱']];
  const hit = APPS.find(([re]) => re.test(ua));
  const wv = android ? /; wv\)/.test(ua) : (ios && !/Safari\//.test(ua));
  return { ua, ios, android, touch: tp > 0, inapp: hit ? hit[1] : (wv ? '앱 안 브라우저' : '') };
})();
/* 글꼴 받는 차례: 우리 주소(fonts/fonts.css, 조각마다 '우리 주소 → Google' 차례) → Google Fonts → 기기 글꼴.
   우리 주소의 글꼴 목록이 없으면(HTML 한 파일만 따로 연 때 · 주소가 엉뚱한 것을 돌려준 때) Google Fonts 목록을 붙인다(shell.html의 __gmGoogleFont) */

/* 미니게임 (3판) — 재는 시험이 아니라 맛보고 · 내 것으로 해 보고 · 빠르기를 바꿔 보는 놀이.
   startGame(id, root, o, onEnd): o = { seconds(0이면 끝없이), speed:'slow'|'mid'|'fast', hero, name, colors, legend, variant }
   돌려주는 것: { stop(), setSpeed(s) }. 지거나 떨어지는 일은 없다. 화면이 가려져 그리기가 멈춰도 100ms 타이머가 한 걸음씩 돌린다. */
function gameHud(o){
  return `<div class="hud"><span class="scorebox">⭐ <b id="gscore">0</b></span>${o.seconds ? '<span class="timebar" aria-hidden="true"><i></i></span>' : '<span class="hudnote">빠르기를 바꿔 가며 해 봐요</span>'}</div>`;
}
function gameLegend(o){ return o.legend ? `<p class="glegend">${o.legend}</p>` : ''; }
function paintArena(arena, o){
  const c1 = o.colors && colorHex(o.colors[0]), c2 = o.colors && colorHex(o.colors[1]);
  if (c1) arena.style.setProperty('--arena', c1);
  if (c2) arena.style.setProperty('--accent', c2);
}
function countdown(el, go, later){
  const seq = ['3', '2', '1', '시작!']; let i = 0;
  (function step(){
    if (i < seq.length){ el.textContent = seq[i++]; later(step, i === seq.length ? 450 : 600); }
    else { el.hidden = true; go(); }
  })();
}
/* 놀이마다 같은 뼈대: 타이머 · 남은 시간 · 그리기 걸음 · 끝내기 */
function gameCore(root, o, onEnd, api){
  const timers = [], bar = $('.timebar i', root), scoreEl = $('#gscore', root), msg = $('#gmsg', root);
  const st = { running:false, done:false, speed:o.speed || 'mid', t0:0, last:0, raf:0, iv:0, score:0 };
  const later = (fn, ms) => { const t = setTimeout(fn, ms); timers.push(t); return t; };
  const step = (now, cap) => { const dt = Math.min(cap, (now - st.last) / 1000); st.last = now; if (api.update) api.update(dt); };
  const frame = now => { if (!st.running) return; step(now, 0.05); st.raf = requestAnimationFrame(frame); };
  function cleanup(){ timers.forEach(clearTimeout); clearInterval(st.iv); cancelAnimationFrame(st.raf); if (api.cleanup) api.cleanup(); }
  function finish(){ if (st.done) return; st.done = true; st.running = false; cleanup(); onEnd(api.result ? api.result() : {}); }
  function start(){
    countdown($('#gcount', root), () => {
      st.running = true; st.t0 = st.last = performance.now();
      if (api.begin) api.begin();
      if (api.update) st.raf = requestAnimationFrame(frame);
      st.iv = setInterval(() => {
        const now = performance.now();
        if (o.seconds){
          const left = Math.max(0, 1 - (now - st.t0) / (o.seconds * 1000));
          if (bar) bar.style.width = (left * 100) + '%';
          if (left <= 0) return finish();
        }
        if (api.update && now - st.last > 180) step(now, 0.12);
      }, 100);
    }, later);
  }
  return { st, later, msg, start, add(n){ st.score += n; scoreEl.textContent = st.score; },
    handle:{ stop(){ st.done = true; st.running = false; cleanup(); }, setSpeed(s){ st.speed = s; if (api.onSpeed) api.onSpeed(s); } } };
}
function startGame(id, root, o, onEnd){
  return ({ dodge: gameDodge, maze: gameMaze, run: gameRun, whack: gameWhack })[id](root, o, onEnd);
}

/* 요리조리 피하기: 별똥별은 피하고 별은 받는다 (모으기 뼈대는 별이 더 많이 떨어진다) */
function gameDodge(root, o, onEnd){
  const EVERY = { slow:0.95, mid:0.7, fast:0.5 }, VY = { slow:0.36, mid:0.5, fast:0.7 };
  root.innerHTML = gameHud(o) +
    `<div class="arena dodge" id="garena"><div class="player" id="gplayer"><span class="pe">${o.hero || '🙂'}</span>${o.name ? `<span class="pn">${esc(o.name)}</span>` : ''}</div><div class="count" id="gcount"></div></div>
     <div class="pad"><button type="button" class="padbtn" data-d="-1" aria-label="왼쪽으로">${ARW('l')}</button><button type="button" class="padbtn" data-d="1" aria-label="오른쪽으로">${ARW('r')}</button></div>
     ${gameLegend(o)}<p class="gmsg" id="gmsg" aria-live="polite">별똥별은 피하고, 별은 받아요</p>`;
  const arena = $('#garena', root), player = $('#gplayer', root);
  paintArena(arena, o);
  let W = arena.clientWidth, H = arena.clientHeight, px = 0.5, dir = 0, pointerX = null, inv = 0, acc = 0, objs = [], bumps = 0;
  const starP = o.variant === 'collect' ? 0.62 : 0.36;
  const place = () => { player.style.transform = `translate(${Math.round(px * W - player.offsetWidth / 2)}px,0)`; };
  const rectX = e => { const r = arena.getBoundingClientRect(); return (e.clientX - r.left) / r.width; };
  const pDown = e => { if (!core.st.running) return; pointerX = rectX(e); try { arena.setPointerCapture(e.pointerId); } catch (err) {} e.preventDefault(); };
  const pMove = e => { if (pointerX != null) pointerX = rectX(e); };
  const pUp = () => { pointerX = null; dir = 0; };
  const padDown = e => { const b = e.target.closest('.padbtn'); if (b){ dir = +b.dataset.d; e.preventDefault(); } };
  const kDown = e => { if (e.key === 'ArrowLeft') dir = -1; else if (e.key === 'ArrowRight') dir = 1; else return; e.preventDefault(); };
  const kUp = e => { if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') dir = 0; };
  const ro = window.ResizeObserver ? new ResizeObserver(() => { W = arena.clientWidth; H = arena.clientHeight; }) : null;
  const core = gameCore(root, o, onEnd, {
    begin(){ W = arena.clientWidth; H = arena.clientHeight; },
    update(dt){
      const sp = core.st.speed;
      if (pointerX != null){ const d = pointerX - px; px += Math.sign(d) * Math.min(Math.abs(d), 1.7 * dt); }
      else px += dir * 0.95 * dt;
      px = Math.max(0.08, Math.min(0.92, px)); place();
      inv = Math.max(0, inv - dt); player.classList.toggle('inv', inv > 0);
      acc += dt;
      if (acc >= EVERY[sp]){
        acc = 0;
        const star = Math.random() < starP, el = document.createElement('span');
        el.className = 'obj'; el.textContent = star ? '⭐' : '☄️'; arena.appendChild(el);
        objs.push({ el, x: 0.08 + Math.random() * 0.84, y: -0.1, star, k: 0.9 + Math.random() * 0.25, dead:false });
      }
      for (const b of objs){
        b.y += VY[sp] * b.k * dt;
        b.el.style.transform = `translate(${Math.round(b.x * W - b.el.offsetWidth / 2)}px,${Math.round(b.y * H)}px)`;
        if (b.y > 0.74 && b.y < 0.93 && Math.abs(b.x - px) < 0.11){
          if (b.star){ b.dead = true; core.add(1); }
          else if (inv <= 0){ b.dead = true; bumps++; inv = 0.9; core.msg.textContent = '앗! 부딪혔어요'; arena.classList.add('shake'); core.later(() => arena.classList.remove('shake'), 260); }
        }
        if (b.y > 1.08) b.dead = true;
        if (b.dead) b.el.remove();
      }
      objs = objs.filter(b => !b.dead);
    },
    result: () => ({ stars: core.st.score, bumps }),
    cleanup(){
      arena.removeEventListener('pointerdown', pDown); arena.removeEventListener('pointermove', pMove);
      window.removeEventListener('pointerup', pUp); window.removeEventListener('pointercancel', pUp);
      window.removeEventListener('keydown', kDown); window.removeEventListener('keyup', kUp);
      if (ro) ro.disconnect();
    },
  });
  arena.addEventListener('pointerdown', pDown); arena.addEventListener('pointermove', pMove);
  window.addEventListener('pointerup', pUp); window.addEventListener('pointercancel', pUp);
  $('.pad', root).addEventListener('pointerdown', padDown);
  window.addEventListener('keydown', kDown); window.addEventListener('keyup', kUp);
  if (ro) ro.observe(arena);
  place(); core.start();
  return core.handle;
}

/* 길 찾기: 방향 단추로 움직여 별을 모으고 문으로 나간다. 먹구름에 닿으면 출발한 곳으로 돌아간다 */
const MAZES = [

  const TICK = { slow:1150, mid:780, fast:460 };   // 먹구름이 한 칸 움직이는 데 걸리는 시간(ms)
  root.innerHTML = gameHud(o) +
    `<div class="arena maze" id="garena"><div class="mgrid" id="mgrid"></div><div class="count" id="gcount"></div></div>
     <div class="pad dpad"><button type="button" class="padbtn" data-m="-1,0" aria-label="위로">${ARW('u')}</button><button type="button" class="padbtn" data-m="0,-1" aria-label="왼쪽으로">${ARW('l')}</button><button type="button" class="padbtn" data-m="1,0" aria-label="아래로">${ARW('d')}</button><button type="button" class="padbtn" data-m="0,1" aria-label="오른쪽으로">${ARW('r')}</button></div>
     ${gameLegend(o)}<p class="gmsg" id="gmsg" aria-live="polite">별을 모으고 문까지 가요. 먹구름은 피해요</p>`;
  const arena = $('#garena', root), grid = $('#mgrid', root), hero = o.hero || '🙂';
  paintArena(arena, o);
  let n = 0, map = [], me = [1, 1], start = [1, 1], foe = [1, 5], foePrev = null, cleared = 0, bumps = 0, foeT = 0, sx = 0, sy = 0;
  function farCell(){   // 출발한 곳에서 먼 빈칸 하나
    const open = []; map.forEach((row, r) => row.forEach((ch, c) => { if (ch === '.' && Math.abs(r - start[0]) + Math.abs(c - start[1]) > 4) open.push([r, c]); }));
    return pickOne(open);
  }
  function load(){
    map = MAZES[n % MAZES.length].map(r => [...r]);
    map.forEach((row, r) => row.forEach((ch, c) => { if (ch === 'S'){ start = [r, c]; map[r][c] = '.'; } }));
    me = start.slice(); foe = farCell(); foePrev = null; foeT = 0; draw();
  }
  function draw(){
    grid.innerHTML = map.map((row, r) => row.map((ch, c) => {
      const isMe = me[0] === r && me[1] === c, isFoe = foe[0] === r && foe[1] === c;
      return `<span class="${ch === '#' ? 'w' : 'p'}">${isMe ? hero : isFoe ? '🌩️' : ch === '*' ? '⭐' : ch === 'E' ? '🚪' : ''}</span>`;
    }).join('')).join('');
  }
  function bump(){ bumps++; me = start.slice(); foe = farCell(); foePrev = null; foeT = 0; core.msg.textContent = '앗, 먹구름! 처음 자리로 돌아가요'; arena.classList.add('shake'); core.later(() => arena.classList.remove('shake'), 260); }
  function move(dr, dc){
    if (!core.st.running) return;
    const r = me[0] + dr, c = me[1] + dc, ch = map[r] && map[r][c];
    if (!ch || ch === '#') return;
    me = [r, c];
    if (ch === '*'){ map[r][c] = '.'; core.add(1); }
    if (ch === 'E'){ cleared++; core.add(2); core.msg.textContent = '빠져나왔어요! 다음 미로예요'; n++; load(); return; }
    if (me[0] === foe[0] && me[1] === foe[1]) bump();
    draw();
  }
  function foeStep(){
    const nb = [[1, 0], [-1, 0], [0, 1], [0, -1]].map(([a, b]) => [foe[0] + a, foe[1] + b]).filter(([r, c]) => map[r] && (map[r][c] === '.' || map[r][c] === '*'));
    if (!nb.length) return;
    const fwd = nb.filter(([r, c]) => !(foePrev && foePrev[0] === r && foePrev[1] === c));
    foePrev = foe; foe = pickOne(fwd.length ? fwd : nb);
    if (me[0] === foe[0] && me[1] === foe[1]) bump();
    draw();
  }
  const KEYS = { ArrowUp:[-1, 0], ArrowDown:[1, 0], ArrowLeft:[0, -1], ArrowRight:[0, 1] };
  const kDown = e => { const m = KEYS[e.key]; if (!m) return; e.preventDefault(); move(m[0], m[1]); };
  const padDown = e => { const b = e.target.closest('.padbtn'); if (!b) return; e.preventDefault(); const [a, c] = b.dataset.m.split(',').map(Number); move(a, c); };
  const pDown = e => { sx = e.clientX; sy = e.clientY; };
  const pUp = e => { const dx = e.clientX - sx, dy = e.clientY - sy; if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return; if (Math.abs(dx) > Math.abs(dy)) move(0, dx > 0 ? 1 : -1); else move(dy > 0 ? 1 : -1, 0); };
  const core = gameCore(root, o, onEnd, {
    update(dt){ foeT += dt * 1000; if (foeT >= TICK[core.st.speed]){ foeT = 0; foeStep(); } },
    result: () => ({ stars: core.st.score, cleared, bumps }),
    cleanup(){ window.removeEventListener('keydown', kDown); arena.removeEventListener('pointerdown', pDown); arena.removeEventListener('pointerup', pUp); },
  });
  window.addEventListener('keydown', kDown);
  $('.pad', root).addEventListener('pointerdown', padDown);
  arena.addEventListener('pointerdown', pDown); arena.addEventListener('pointerup', pUp);
  load(); core.start();
  return core.handle;
}

/* 폴짝 달리기: 단추 하나. 돌이 오면 뛰어넘고, 높이 뜬 별은 뛰어서 잡는다 */
function gameRun(root, o, onEnd){
  const V = { slow:0.42, mid:0.6, fast:0.8 }, HX = 0.18;
  root.innerHTML = gameHud(o) +
    `<div class="arena run" id="garena"><span class="rhero" id="ghero"><span class="pe">${o.hero || '🙂'}</span>${o.name ? `<span class="pn">${esc(o.name)}</span>` : ''}</span><i class="rground"></i><div class="count" id="gcount"></div></div>
     <div class="pad"><button type="button" class="padbtn jump" id="gjump">폴짝!</button></div>
     ${gameLegend(o)}<p class="gmsg" id="gmsg" aria-live="polite">돌이 다가오면 눌러서 뛰어넘어요</p>`;
  const arena = $('#garena', root), heroEl = $('#ghero', root);
  paintArena(arena, o);
  let W = arena.clientWidth, H = arena.clientHeight, y = 0, vy = 0, inv = 0, wait = 0.6, objs = [], bumps = 0, jumped = 0;
  const jump = () => { if (core.st.running && y <= 0.001) vy = 2.5; };
  const kDown = e => { if (e.key === ' ' || e.key === 'ArrowUp'){ e.preventDefault(); jump(); } };
  const pDown = e => { e.preventDefault(); jump(); };
  const ro = window.ResizeObserver ? new ResizeObserver(() => { W = arena.clientWidth; H = arena.clientHeight; }) : null;
  const core = gameCore(root, o, onEnd, {
    begin(){ W = arena.clientWidth; H = arena.clientHeight; },
    update(dt){
      const v = V[core.st.speed];
      vy -= 7.8 * dt; y = Math.max(0, y + vy * dt); if (y === 0) vy = 0;
      heroEl.style.transform = `translateY(${Math.round(-y * H)}px)`;
      inv = Math.max(0, inv - dt); heroEl.classList.toggle('inv', inv > 0);
      wait -= dt;
      if (wait <= 0){
        const star = Math.random() < 0.3, el = document.createElement('span');
        el.className = 'robj' + (star ? ' star' : ''); el.textContent = star ? '⭐' : '🪨'; arena.appendChild(el);
        objs.push({ el, x: 1.06, star, dead:false, passed:false });
        wait = (0.62 + Math.random() * 0.5) / v;
      }
      for (const b of objs){
        b.x -= v * dt;
        b.el.style.transform = `translateX(${Math.round(b.x * W)}px)`;
        const near = Math.abs(b.x - HX) < 0.065;
        if (b.star){ if (near && y > 0.13){ b.dead = true; core.add(1); } }
        else if (near && y < 0.12 && inv <= 0 && !b.passed){ b.passed = true; bumps++; inv = 0.8; core.msg.textContent = '앗! 걸렸어요'; arena.classList.add('shake'); core.later(() => arena.classList.remove('shake'), 260); }
        else if (!b.passed && b.x < HX - 0.07){ b.passed = true; jumped++; core.add(1); }
        if (b.x < -0.12) b.dead = true;
        if (b.dead) b.el.remove();
      }
      objs = objs.filter(b => !b.dead);
    },
    result: () => ({ stars: core.st.score, jumped, bumps }),
    cleanup(){ window.removeEventListener('keydown', kDown); arena.removeEventListener('pointerdown', pDown); if (ro) ro.disconnect(); },
  });
  window.addEventListener('keydown', kDown);
  arena.addEventListener('pointerdown', pDown);
  $('#gjump', root).addEventListener('pointerdown', pDown);
  if (ro) ro.observe(arena);
  core.start();
  return core.handle;
}

/* 번쩍 잡기: 맛보기에는 없다. 잡기 뼈대를 고른 아이의 '한 판'과 빠르기 실험에만 쓴다 */
function gameWhack(root, o, onEnd){
  const SHOW = { slow:1150, mid:840, fast:620 }, GAP = { slow:520, mid:380, fast:260 };
  root.innerHTML = gameHud(o) +
    `<div class="arena whack" id="garena">${Array.from({ length:9 }, (_, i) => `<button type="button" class="hole" data-i="${i}" aria-label="구멍 ${i + 1}"><span class="pop"></span></button>`).join('')}<div class="count" id="gcount"></div></div>
     ${gameLegend(o)}<p class="gmsg" id="gmsg" aria-live="polite">별은 누르고, 먹구름은 누르지 않아요</p>`;
  const arena = $('#garena', root), holes = $$('.hole', root), live = new Map();
  paintArena(arena, o);
  let wrong = 0;
  function hide(i){ holes[i].classList.remove('up'); live.delete(i); }
  function spawn(){
    if (!core.st.running) return;
    const free = holes.map((_, i) => i).filter(i => !live.has(i)), sp = core.st.speed;
    if (free.length){
      const i = pickOne(free), decoy = Math.random() < 0.2, h = holes[i];
      h.querySelector('.pop').textContent = decoy ? '🌩️' : '⭐';
      h.classList.remove('hit', 'bad'); h.classList.add('up');
      live.set(i, { decoy, timer: core.later(() => hide(i), SHOW[sp]) });
    }
    core.later(spawn, GAP[sp] + Math.random() * 180);
  }
  const tap = e => {
    const h = e.target.closest('.hole'); if (!h || !core.st.running) return;
    e.preventDefault();
    const i = +h.dataset.i, b = live.get(i); if (!b) return;
    clearTimeout(b.timer); live.delete(i); h.classList.remove('up');
    if (b.decoy){ wrong++; h.classList.add('bad'); core.msg.textContent = '앗, 먹구름이에요!'; }
    else { h.classList.add('hit'); core.add(1); }
    core.later(() => h.classList.remove('hit', 'bad'), 220);
  };
  const core = gameCore(root, o, onEnd, { begin(){ spawn(); }, result: () => ({ stars: core.st.score, wrong }), cleanup(){ root.removeEventListener('pointerdown', tap); } });
  root.addEventListener('pointerdown', tap);
  core.start();
  return core.handle;
}

/* 미니게임이 없는 뼈대(짝 맞추기 · 퀴즈): 어떤 놀이인지 보이는 그림만 그린다(내 주인공과 내가 고른 색이 들어간다) */
function stubArt(id, S){

/* 답을 AI에게 부탁하는 글(프롬프트)로 엮기 — 3-4학년은 일곱 묶음(기획안 9절 견본 2).
   방해꾼과 도우미 · 단계와 빠르기는 '게임 방법'에 합친다. 아이는 엮어 준 글을 읽고 빠진 것을 한마디 더한다(S.more). */
const PART_TAGS = [['ask','부탁'],['hero','주인공'],['world','세계와 이야기'],['how','게임 방법'],['twist','나만의 특별 규칙'],['look','화면과 소리'],['must','꼭 지켜 줘']];

function ctxOf(S){
  const b = BONES[S.bone] || BONES.run, r = S.rule;
  const mv = b.moves[r.move == null ? 0 : r.move] || b.moves[0];
  const T = b.tOpts ? b.tOpts[0] : 60;
  return { bone: BONES[S.bone] ? S.bone : 'run', N: S.hero.name || '주인공', C: r.collect || S.hero.like || '별', E: r.enemy || S.hero.fear || '방해꾼', M: mv[0],
    dev: S.feel.device || 'both', PT: r.point || 1, T, L: r.lives || 3, topic: r.topic || S.hero.like || '내가 좋아하는 것' };
}
/* 빠르기 실험에서 고른 빠르기 · 어렵기 · 자신 있던 놀이 */
function speedLine(S){
  const b = BONES[S.bone] || BONES.run, sp = S.rule.speed;
  let t = { slow:'처음에는 천천히 시작해 줘.', mid:'처음에는 보통 빠르기로 시작해 줘.', fast:'처음부터 조금 빠르게 해도 돼.' }[sp] || '처음에는 천천히 시작해 줘.';
  if (sp && b.game) t += ' 내가 해 보고 고른 빠르기야.';
  t += S.rule.diff === 'hard' ? ' 갈수록 점점 빨라지게 해 줘.' : S.rule.diff === 'easy' ? ' 끝까지 쉽게 해 줘.' : ' 갈수록 조금씩 빨라져.';
  if (S.sure && S.sure !== 'none' && b.taste !== S.sure) t += ' 나는 이런 놀이가 아직 서투르니까 처음은 아주 쉽게 해 줘.';
  return t;
}
function autoParts(S){
  const b = BONES[S.bone] || BONES.run, c = ctxOf(S), r = S.rule, h = S.hero, w = S.world, st = S.story, f = S.feel, P = S.pick, out = {};

  const title = S.title || '아직 이름 없는 게임';
  let ask = `${b.kind} 게임 '${title}'${josa(title, '을/를')} 만들어 줘. 내가 직접 생각한 게임이야.`;
  if (S.seed) ask += ` 처음 떠올린 것은 '${S.seed}'${josa(S.seed, '이었어/였어')}.`;
  out.ask = ask;

  let who = (h.look || '내가 만든 주인공') + (h.name ? ` '${h.name}'` : '');
  let hero = who + josa(who, '이야/야') + '.';
  if (h.emoji) hero += ` 게임에서는 ${h.emoji} 이모지로 그려 줘.`;
  if (h.mind) hero += ' ' + fin(h.mind);
  if (h.like && h.fear) hero += ` ${j(h.like, '을/를')} 좋아하고 ${j(h.fear, '을/를')} 무서워해.`;
  else if (h.like) hero += ` ${j(h.like, '을/를')} 좋아해.`;
  out.hero = hero;

  const ws = [];
  if (w.place && w.time) ws.push(`배경은 ${j(w.place, '이고/고')}, 때는 ${j(w.time, '이야/야')}.`);
  else if (w.place) ws.push(`배경은 ${j(w.place, '이야/야')}.`);
  if (w.colors && w.colors.length) ws.push(`색은 ${w.colors.join(', ')}${josa(w.colors[w.colors.length - 1], '을/를')} 써 줘.`);
  if (st.begin) ws.push(`어느 날 ${fin(st.begin)}`);
  if (st.win) ws.push(`성공하면 ${fin(st.win)}`);
  if (st.begin) ws.push(P.story === 'b' ? '이야기는 한 줄만 보여 주고 바로 시작해.' : '시작 화면에서 이 이야기를 보여 줘.');
  out.world = ws.join(' ');

  /* 게임 방법: 뼈대 · 방해꾼 · 아이템 · 목숨 · 빠르기를 한 묶음에 */
  let how = b.how(c) + ' ' + b.enemy(c);
  if (r.power) how += ` ${j(r.power, '을/를')} 얻으면 ${fin(r.fx || FX_COMMON[0][0])}`;
  how += ` 목숨은 ${c.L}개야. ${speedLine(S)}`;
  if (P.players === 'b') how += ' 두 사람이 번갈아 할 수 있게 해 줘.';
  if (P.hard === 'b') how += ' 잘하는 사람도 도전할 만하게 해 줘.';
  if (P.goal === 'a') how += ' 최고 점수를 기억해 줘.';
  if (P.goal === 'b') how += ' 끝까지 가면 축하 장면을 보여 줘.';
  if (S.more) how += ' 그리고 ' + fin(S.more);
  out.how = how;

  out.twist = fin(r.twist);

  let look = `${f.art || '알록달록한'} 느낌으로 ${P.tone === 'b' ? '멋지게' : '귀엽게'} 꾸미고, 그림은 이모지로 그려 줘.`;
  const md = (f.mood || []).map(k => MOOD[k]).filter(Boolean);
  if (md.length) look += ` 하는 사람이 ${md[0].b}면 좋겠어.`;
  if (f.winMsg) look += ` 성공하면 "${f.winMsg}"${josa(f.winMsg, '이라고/라고')} 보여 줘.`;
  out.look = look;

  out.must = "설치 없이 바로 되는 게임으로 만들어 줘. 글자는 한국어로 크게 써 줘. 게임 방법 설명과 '다시 하기' 단추를 넣어 줘. 무섭거나 나쁜 내용, 다른 게임이나 만화의 캐릭터는 넣지 마.";
  return out;
}
function partsOf(S){
  const auto = autoParts(S);
  return PART_TAGS.map(([k, tag]) => {
    const base = auto[k], mine = S.edits && typeof S.edits[k] === 'string' ? S.edits[k] : null;
    return { k, tag, auto: base, text: mine != null ? mine : base, edited: mine != null, by: '' };
  });
}
/* 쓰지 않지만 app.js가 부르는 곳이 있어 남긴다 */
function howMaterials(){ return []; }

/* 확인하기 점검표(3-4학년은 다섯 가지 안팎) */
function checkItems(S){
  const c = ctxOf(S), h = S.hero, w = S.world, r = S.rule, items = [];
  const whoBase = h.name || h.look || '주인공', who = `${h.emoji ? h.emoji + ' ' : ''}${whoBase}`;
  items.push({ k:'hero', q:`주인공이 ${who}인가요?`, redo:'주인공이 내가 말한 것과 달라.', fix:`주인공을 ${h.emoji ? h.emoji + ' ' : ''}${c.N}${josa(c.N, '으로/로')} 해 줘` });
  if (w.place) items.push({ k:'world', q:`배경이 ‘${w.place}’ 같나요?`, redo:'배경이 내가 말한 곳과 달라.', fix:`배경을 ${w.place}${josa(w.place, '으로/로')} 바꿔 줘` });
  items.push({ k:'how', q:`${j(c.C, '을/를')} 모으고, 목숨이 ${c.L}개인가요?`, redo:'모으는 것과 목숨이 내가 말한 것과 달라.', fix:`${j(c.C, '을/를')} 모으게 하고 목숨은 ${c.L}개로 해 줘` });
  items.push({ k:'foe', q:`${j(c.E, '이/가')} 방해꾼으로 나오나요?`, redo:`${j(c.E, '이/가')} 안 나와.`, fix:`${j(c.E, '을/를')} 방해꾼으로 넣어 줘` });
  if (r.twist) items.push({ k:'twist', q:'나만의 특별 규칙이 들어갔나요?', redo:'나만의 특별 규칙이 빠졌어.', fix:`이 규칙을 꼭 넣어 줘. ${fin(r.twist)}` });
  if (S.feel.winMsg) items.push({ k:'msg', q:`성공하면 “${S.feel.winMsg}”가 나오나요?`, redo:'성공했을 때 나오는 말이 달라.', fix:`성공하면 "${S.feel.winMsg}"${josa(S.feel.winMsg, '이라고/라고')} 보여 줘` });
  return items;
}
/* 다시 부탁하는 말은 하나만: 달랐던 것 가운데 아이가 고른 하나(redoK) */
function redoItem(S){
  const bad = checkItems(S).filter(it => S.check && S.check[it.k] === 'x');
  return bad.find(it => it.k === S.redoK) || bad[0] || null;
}
function redoText(S){
  const it = redoItem(S);
  if (it){ const v = fin((S.redo || {})[it.k] || ''); return v ? `방금 만든 게임에서 내 부탁과 다른 곳이 있어. ${it.redo} ${v} 나머지는 그대로 둬 줘.` : ''; }
  return S.redoMore ? `방금 만든 게임 마음에 들어! 하나만 더해 줘. ${fin(S.redoMore)} 나머지는 그대로 둬 줘.` : '';

function fit(){

  const list = opts.map(([v, l, sub], i) => tile(v, l, sub, cur === v, { pic:ICON[v], k:i + 1 }));
  if (q.custom) list.push(tile('__c', '직접 쓸래요', '', isC, { pic:'✏️', k:list.length + 1 }));
  paint({ hd: head(st, esc(T(q.q)), q.help ? esc(T(q.help)) : ''),
    an: tilesBox(list, colsFor(list.length)) + (q.custom ? `<div id="customBox"${isC ? '' : ' hidden'}>${fieldBlock({ id:'f', value:isC ? cur : '', ph:q.custom.ph, max:q.custom.max, label:'직접 쓰기', q:T(q.q) })}</div>` : ''),
    act: act('다음', { keys:`<kbd>1</kbd>~<kbd>${list.length}</kbd> 고르기` }) });

  if (q.custom) inp = bindInput('f', q.custom.max, v => { if (customOn) setP(S, q.path, v); }, true);

      try { inp.focus({ preventScroll:true }); } catch (e) {}

}

  /* 예시 답의 엔딩 화면에서 '그림 저장'을 직접 눌러 본다(쓴 답은 건드리지 않는다). 왼쪽 위 단추로 진단 결과에 돌아온다 */
  const bk = document.createElement('button');
  bk.type = 'button'; bk.className = 'dgback'; bk.textContent = '← 진단 결과'; bk.hidden = true; document.body.appendChild(bk);
  bk.onclick = () => { closeCardView(); el.hidden = false; bk.hidden = true; };
  $('#dgSave').onclick = () => { el.hidden = true; bk.hidden = false; S = dgEX(); S.step = 'done'; render(); CARDP = cardMake(); };
  $('#dgOpen').onclick = () => { location.href = location.pathname; };
}
if (DIAG) diagRun();
